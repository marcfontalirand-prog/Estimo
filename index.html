<script>
/* ===== Moteur DVF (copie générée depuis js/dvf.js — ne pas éditer ici) ===== */
// ---- js/dvf.js ----
// Module DVF — prix/m² à proximité. Source principale : fichiers Etalab geo-dvf précalculés en JSON par commune
// (data/dvf/<dep>/, servis par le site lui-même, cf. tools/build-dvf.py). Repli : API Cerema « DVF open data » (CORS ouvert).
// Logique pure (filtres, médiane, IQR) testable sous Node ; fonctions réseau isolées.
const GEOCODE_URL = 'https://api-adresse.data.gouv.fr/search/';
const LOCAL_BASE = new URL('data/dvf/', document.baseURI).href;
const SOURCE_LABEL = 'DVF Etalab (geo-dvf)';
// Date de la vente la plus récente publiée dans data/dvf/ — réécrite par tools/build-dvf.py.
const DATA_CUTOFF = '2025-12-31';
const FALLBACK_LABEL = 'DVF (Cerema / DGFiP), source de secours';
const DVF_URL = 'https://apidf-preprod.cerema.fr/dvf_opendata/geomutations/';
// codtypbien Cerema : 111 = une maison, 121 = un appartement (mutation d'un seul logement).
const TYPE_CODES = { appartement: '121', maison: '111' };
const MAX_TILE = 0.019; // l'API refuse une emprise > 0,02° × 0,02°
const RADIUS_STEPS = [300, 500, 750, 1000, 1500, 2000];
const MIN_COMPARABLES = 8;

const R = 6371000;
function distance(lat1, lon1, lat2, lon2) {
  const t = Math.PI / 180, dLat = (lat2 - lat1) * t, dLon = (lon2 - lon1) * t;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * t) * Math.cos(lat2 * t) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function centroid(geom) {
  if (!geom) return null;
  if (geom.type === 'Point') return { lon: geom.coordinates[0], lat: geom.coordinates[1] };
  const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.type === 'MultiPolygon' ? geom.coordinates : [];
  let sx = 0, sy = 0, n = 0;
  for (const p of polys) for (const [x, y] of p[0] || []) { sx += x; sy += y; n++; }
  return n ? { lon: sx / n, lat: sy / n } : null;
}
function bboxTiles(lat, lon, radius) {
  lat = Number(lat); lon = Number(lon);
  const dLat = radius / 111320, dLon = radius / (111320 * Math.cos(lat * Math.PI / 180));
  const [w, s, e, n] = [lon - dLon, lat - dLat, lon + dLon, lat + dLat];
  const nx = Math.ceil((e - w) / MAX_TILE), ny = Math.ceil((n - s) / MAX_TILE);
  const sx = (e - w) / nx, sy = (n - s) / ny, out = [];
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) out.push([w + i * sx, s + j * sy, w + (i + 1) * sx, s + (j + 1) * sy].map((v) => v.toFixed(5)));
  return out;
}
function quantile(sorted, q) {
  if (!sorted.length) return NaN;
  const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}
const median = (arr) => quantile([...arr].sort((a, b) => a - b), 0.5);
// Exclusion des valeurs aberrantes par la règle de Tukey (1,5 × IQR).
function iqrFilter(values, k = 1.5) {
  const s = [...values].sort((a, b) => a - b);
  if (s.length < 4) return { kept: s, low: -Infinity, high: Infinity, removed: 0 };
  const q1 = quantile(s, 0.25), q3 = quantile(s, 0.75), iqr = q3 - q1;
  const low = q1 - k * iqr, high = q3 + k * iqr;
  const kept = s.filter((v) => v >= low && v <= high);
  return { kept, low, high, removed: s.length - kept.length };
}
// Feature GeoJSON Cerema -> vente normalisée
function normalize(f, subject) {
  const p = f.properties || {};
  const c = centroid(f.geometry);
  const prix = Number(p.valeurfonc), surface = Number(p.sbati);
  if (!c || !(prix > 0) || !(surface > 0)) return null;
  return {
    id: p.idmutinvar || p.idopendata, date: p.datemut, prix, surface, prixM2: prix / surface,
    type: p.codtypbien === '111' ? 'maison' : p.codtypbien === '121' ? 'appartement' : 'autre',
    nature: p.libnatmut, vefa: !!p.vefa, parcelle: (p.l_idpar || [])[0] || '', terrain: Number(p.sterr) || 0,
    lat: c.lat, lon: c.lon, distance: subject ? Math.round(distance(subject.lat, subject.lon, c.lat, c.lon)) : null,
  };
}
// Sélection des comparables : même type, ventes récentes, rayon, surface proche, bornes de plausibilité.
function selectComparables(sales, { type, surface, radius, sinceDate, surfaceTol = 0.35 }) {
  return sales.filter((s) => s && s.type === type && /^Vente/.test(s.nature || 'Vente')
    && (!sinceDate || s.date >= sinceDate) && (radius == null || s.distance <= radius)
    && (!surface || (s.surface >= surface * (1 - surfaceTol) && s.surface <= surface * (1 + surfaceTol)))
    && s.prixM2 >= 300 && s.prixM2 <= 60000);
}
function stats(comps) {
  const f = iqrFilter(comps.map((c) => c.prixM2));
  const kept = comps.filter((c) => c.prixM2 >= f.low && c.prixM2 <= f.high);
  const s = f.kept;
  return { n: kept.length, removed: f.removed, median: Math.round(quantile(s, 0.5)), q1: Math.round(quantile(s, 0.25)), q3: Math.round(quantile(s, 0.75)),
    min: Math.round(s[0]), max: Math.round(s[s.length - 1]), kept, outliers: comps.filter((c) => !kept.includes(c)) };
}
// Élargissement automatique : rayon puis tolérance de surface, jusqu'à MIN_COMPARABLES.
function analyse(sales, { type, surface, radius = 500, sinceDate, min = MIN_COMPARABLES, autoWiden = true }) {
  const radii = autoWiden ? [radius, ...RADIUS_STEPS.filter((r) => r > radius)] : [radius];
  const tols = autoWiden ? [0.35, 0.6, Infinity] : [0.35];
  let best = null;
  for (const tol of tols) for (const r of radii) {
    const comps = selectComparables(sales, { type, surface: tol === Infinity ? 0 : surface, radius: r, sinceDate, surfaceTol: tol });
    const st = comps.length ? stats(comps) : { n: 0, removed: 0, kept: [], outliers: [] };
    best = { ...st, radius: r, surfaceTol: tol, widened: r !== radius || tol !== 0.35 };
    if (st.n >= min) return best;
  }
  return best;
}
function sinceDate(years = 3, now = new Date()) {
  const d = new Date(now); d.setFullYear(d.getFullYear() - years); return d.toISOString().slice(0, 10);
}

// Ligne compacte Etalab [date, prix, surface, type, lat, lon, terrain, vefa, parcelle] -> vente normalisée
function normalizeRow(r, subject, commune = '') {
  const [date, prix, surface, t, lat, lon, terrain, vefa, parcelle] = r;
  if (!(prix > 0) || !(surface > 0)) return null;
  return { id: `${commune}-${date}-${parcelle}-${prix}-${surface}`, date, prix, surface, prixM2: prix / surface,
    type: t === 'm' ? 'maison' : t === 'a' ? 'appartement' : 'autre', nature: vefa ? "Vente en l'état futur d'achèvement" : 'Vente', vefa: !!vefa,
    parcelle: parcelle || '', terrain: terrain || 0, lat, lon, distance: subject ? Math.round(distance(subject.lat, subject.lon, lat, lon)) : null };
}
// Communes dont l'emprise (bbox des ventes) élargie du rayon contient le point.
function communesNear(index, lat, lon, radius) {
  const dLat = radius / 111320, dLon = radius / (111320 * Math.cos(lat * Math.PI / 180));
  return Object.entries(index.communes || {}).filter(([, c]) => { const [w, s, e, n] = c.bbox; return lon >= w - dLon && lon <= e + dLon && lat >= s - dLat && lat <= n + dLat; }).map(([k]) => k);
}
const depOf = (citycode) => (!citycode ? '06' : /^97/.test(citycode) ? citycode.slice(0, 3) : citycode.slice(0, 2));

// ---------- Réseau ----------
async function geocode(q, { limit = 5, fetchFn = fetch } = {}) {
  const r = await fetchFn(`${GEOCODE_URL}?q=${encodeURIComponent(q)}&limit=${limit}`);
  if (!r.ok) throw new Error(`Géocodage indisponible (${r.status})`);
  const j = await r.json();
  return (j.features || []).map((f) => ({ label: f.properties.label, city: f.properties.city, citycode: f.properties.citycode, score: f.properties.score, lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1] }));
}
// GET JSON avec 2 nouvelles tentatives (l'API Cerema est parfois lente ou coupe la connexion).
async function getJson(url, fetchFn, tries = 3) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetchFn(url, { cache: 'no-store' });
      if (r.ok) return await r.json();
      last = new Error(`API DVF indisponible (${r.status})`);
      if (r.status < 500 && r.status !== 429) break;
    } catch (e) { last = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 800 * (i + 1)));
  }
  throw last;
}
async function fetchTile(t, { minYear, type, fetchFn, lat, lon, seen, onProgress }) {
  let url = `${DVF_URL}?in_bbox=${t.join(',')}&anneemut_min=${minYear}&codtypbien=${TYPE_CODES[type]}&page_size=500`;
  for (let guard = 0; url && guard < 20; guard++) {
    const j = await getJson(url, fetchFn);
    for (const f of j.features || []) { const s = normalize(f, { lat, lon }); if (s && !seen.has(s.id)) seen.set(s.id, s); }
    onProgress?.(seen.size);
    url = j.next ? j.next.replace(/^http:/, 'https:') : null;
  }
}
const jsonCache = new Map();
async function getLocal(url, fetchFn) {
  if (!jsonCache.has(url)) jsonCache.set(url, (async () => { const r = await fetchFn(url); if (!r.ok) throw new Error(`Données DVF Etalab indisponibles (${r.status})`); return r.json(); })().catch((e) => { jsonCache.delete(url); throw e; }));
  return jsonCache.get(url);
}
async function fetchSalesLocal({ lat, lon, radius, type, citycode, years = 3, fetchFn = fetch, onProgress, base = LOCAL_BASE }) {
  const dep = depOf(citycode);
  const index = await getLocal(`${base}${dep}/index.json`, fetchFn);
  const codes = communesNear(index, lat, lon, radius);
  if (citycode && index.communes?.[citycode] && !codes.includes(citycode)) codes.push(citycode);
  if (!codes.length) throw new Error('Adresse hors de la zone couverte par les données DVF Etalab');
  const minYear = String(new Date().getFullYear() - years), out = [];
  for (const j of await Promise.all(codes.map((c) => getLocal(`${base}${dep}/${c}.json`, fetchFn)))) {
    for (const r of j.rows) { if (r[0].slice(0, 4) < minYear) continue; const s = normalizeRow(r, { lat, lon }, j.commune); if (s && s.type === type && s.distance <= radius) out.push(s); }
    onProgress?.(out.length);
  }
  return { sales: out, lastSale: index.derniere_vente || out.reduce((m, s) => (s.date > m ? s.date : m), '') };
}
async function fetchSales({ lat, lon, radius, type, years = 3, fetchFn = fetch, onProgress }) {
  const minYear = new Date().getFullYear() - years;
  const seen = new Map();
  await Promise.all(bboxTiles(lat, lon, radius).map((t) => fetchTile(t, { minYear, type, fetchFn, lat, lon, seen, onProgress })));
  return [...seen.values()];
}
// Recherche complète : rayon demandé d'abord, puis élargissement (rayon, puis tolérance de surface) si trop peu de ventes.
// Source Etalab (fichiers locaux) ; l'API Cerema n'est interrogée que si cette source échoue.
async function priceNear({ lat, lon, type, surface, citycode, radius = 500, years = 3, autoWiden = true, fetchFn = fetch, onProgress, base }) {
  const since = sinceDate(years);
  const maxR = autoWiden ? Math.max(radius, 2000) : radius;
  try {
    const { sales } = await fetchSalesLocal({ lat, lon, radius: maxR, type, citycode, years, fetchFn, onProgress, base });
    const res = analyse(sales, { type, surface, radius, sinceDate: since, autoWiden });
    const lastSale = res.kept.reduce((m, s) => (s.date > m ? s.date : m), '');
    return { ...res, requestedRadius: radius, fetched: sales.length, since, lastSale, source: SOURCE_LABEL, fallback: false, at: Date.now() };
  } catch (e) {
    const r = await priceNearCerema({ lat, lon, type, surface, radius, years, autoWiden, fetchFn, onProgress });
    return { ...r, fallback: true, fallbackReason: e.message };
  }
}
async function priceNearCerema({ lat, lon, type, surface, radius = 500, years = 3, autoWiden = true, fetchFn = fetch, onProgress }) {
  const since = sinceDate(years);
  let sales = await fetchSales({ lat, lon, radius, type, years, fetchFn, onProgress });
  let res = analyse(sales, { type, surface, radius, sinceDate: since, autoWiden: false });
  if (autoWiden && res.n < MIN_COMPARABLES) {
    for (const r of RADIUS_STEPS.filter((x) => x > radius)) {
      sales = await fetchSales({ lat, lon, radius: r, type, years, fetchFn, onProgress });
      res = analyse(sales, { type, surface, radius, sinceDate: since, autoWiden: true });
      if (res.n >= MIN_COMPARABLES || r >= 1500) break;
    }
  }
  const lastSale = res.kept.reduce((m, s) => (s.date > m ? s.date : m), '');
  return { ...res, requestedRadius: radius, fetched: sales.length, since, lastSale, source: FALLBACK_LABEL, at: Date.now() };
}

// ---- js/loyers.js ----
// Module loyers — Carte des loyers ANIL / Ministère du Logement (data/loyers/<dep>.json, cf. tools/build-loyers.py).
const LOYERS_BASE = new URL('data/loyers/', document.baseURI).href;
const MEUBLE_PRIME = 0.15; // hypothèse Estimo : prime meublé +15 % (la carte ne couvre que le non meublé)
// Choix de l'indicateur : maison -> mai ; appartement 1-2 pièces -> app12, 3 pièces et plus -> app3, sinon app.
function pickIndicator(c, type, pieces) {
  if (!c) return null;
  if (type === 'maison') return c.mai ? { key: 'mai', label: 'Maisons', v: c.mai } : null;
  const k = pieces >= 3 ? 'app3' : pieces >= 1 ? 'app12' : 'app';
  const key = c[k] ? k : 'app';
  return c[key] ? { key, label: { app: 'Appartements', app12: 'Appartements 1-2 pièces', app3: 'Appartements 3 pièces et plus' }[key], v: c[key] } : null;
}
// Loyer mensuel (charges comprises) et rendement brut = loyer annuel / prix de vente.
function rentEstimate(data, { citycode, type, surface, pieces, prixVente, meublePossible = true }) {
  const c = data?.communes?.[citycode];
  if (!c) throw new Error('Commune absente de la carte des loyers');
  if (!(surface > 0)) throw new Error('Surface requise');
  const ind = pickIndicator(c, type, pieces);
  if (!ind) throw new Error('Pas d’indicateur pour ce type de bien');
  const [m2, lo, hi, typpred, nbobs] = ind.v;
  const vide = Math.round(m2 * surface), meuble = meublePossible ? Math.round(m2 * surface * (1 + MEUBLE_PRIME)) : null;
  const rdt = (l) => (prixVente > 0 && l ? (l * 12) / prixVente : null);
  return { commune: c.nom, citycode, indicateur: ind.label, m2, bas: Math.round(lo * surface), haut: Math.round(hi * surface), loM2: lo, hiM2: hi,
    vide, meuble, rendementVide: rdt(vide), rendementMeuble: rdt(meuble), prixVente: prixVente || null, typpred, nbobs,
    encadrement: !!c.encadrement, encadrementNote: data.encadrement_note, source: data.source, annee: data.annee, reference: data.reference };
}

// ---- js/ajust.js ----
// Module ajustement — traduit les champs qualitatifs saisis par l'agent en coefficients
// explicites appliqués à la médiane DVF (€/m²). Pur : aucun DOM, testé par tests/ajust.test.mjs.
//
// MÉTHODE ET LIMITE, à ne pas masquer : la médiane DVF décrit le marché d'un rayon donné,
// toutes qualités confondues — elle contient donc déjà l'état moyen des biens vendus.
// Les coefficients ci-dessous ne remplacent pas cette réalité : ils mesurent un écart
// raisonnablement documenté par rapport au bien moyen du secteur.
// D'où deux garde-fous : chaque ligne est bornée à ±8 %, le total à ±20 %.
const AJUST_VERSION = 1;
const CAP_TOTAL = 0.2;   // dérive maximale de la valeur finale vs médiane DVF
const CAP_COEF = 0.08;   // dérive maximale d'une ligne
const CAP_MANUEL = 0.1;  // positionnement libre de l'agent

function ajustNum(v) {
  if (v === true) return 1;
  if (v === false || v == null || v === '') return null;
  const x = parseFloat(String(v).replace(',', '.').replace(/\s/g, ''));
  return Number.isFinite(x) ? x : null;
}
function clampUnit(x, c) { return Math.max(-c, Math.min(c, x)); }
function same(v, ...opts) { return opts.includes(String(v || '').trim()); }

const AJR = (id, group, label, why, pct) => ({ id, group, label, why, pct });

const RULES = [
  // ---- Le bien ----
  AJR('etage', 'Bien', 'Étage élevé',
    'Au-dessus du 2e, étage élevé = calme et vue ; écart constaté sur les ventes du secteur.',
    (d, c) => { if (c.type !== 'appartement') return null; const e = ajustNum(d.bien && d.bien.etage); if (e == null || e < 3) return null; return e >= 5 ? 0.04 : 0.02; }),
  AJR('rdc', 'Bien', 'Rez-de-chaussée',
    'Un rez-de-chaussée se commercialise moins bien : sécurité, vis-à-vis, lumière.',
    (d, c) => { if (c.type !== 'appartement') return null; const e = ajustNum(d.bien && d.bien.etage); return e === 0 ? -0.05 : null; }),
  AJR('sansasc', 'Bien', 'Sans ascenseur (étage ≥ 2)',
    'L\'absence d\'ascenseur pénalise les étages hauts, en particulier au-delà du 2e.',
    (d, c) => { if (c.type !== 'appartement') return null; const e = ajustNum(d.bien && d.bien.etage); if (e == null || e < 2) return null; return (d.bien && d.bien.ascenseur) ? null : -0.04; }),
  AJR('terrasse', 'Bien', 'Terrasse',
    'La terrasse est le premier critère de prime sur la Côte d\'Azur, devant le balcon.',
    (d) => { const t = ajustNum(d.bien && d.bien.terrasse); if (t == null) return null; if (t >= 8) return 0.04; if (t >= 3) return 0.02; return null; }),
  AJR('balcon', 'Bien', 'Balcon',
    'Un balcon compte, mais moins qu\'une terrasse : pas de cumul si une terrasse est déjà primée.',
    (d) => { const b = ajustNum(d.bien && d.bien.balcon); const t = ajustNum(d.bien && d.bien.terrasse); if (b == null || b < 3) return null; if (t != null && t >= 8) return null; return 0.015; }),
  AJR('jardin', 'Bien', 'Jardin',
    'Sur une maison, le jardin privatif pèse sur le prix au m² bâti.',
    (d, c) => { if (c.type !== 'maison') return null; const j = ajustNum(d.bien && d.bien.jardin); if (j == null) return null; if (j >= 100) return 0.03; if (j >= 30) return 0.015; return null; }),
  AJR('cave', 'Bien', 'Cave / annexes',
    'Une cave ou un cellier est un plus attendu, mais marginal sur le prix au m².',
    (d) => { const v = ajustNum(d.bien && d.bien.cave); return v != null && v >= 3 ? 0.01 : null; }),
  AJR('surface', 'Bien', 'Effet de taille',
    'Les petits logements se vendent plus cher au m², les grands moins cher : effet mesurable sur DVF.',
    (d, c) => { const s = c.S; if (s == null) return null; if (s < 35) return 0.05; if (s < 50) return 0.02; if (s > 120) return -0.03; if (s > 90) return -0.015; return null; }),
  // ---- L'environnement ----
  AJR('expo', 'Environnement', 'Exposition',
    'Plein sud ou traversant : lumière et confort de vie, argument de vente récurrent.',
    (d) => { const x = d.bien && d.bien.exposition; if (same(x, 'Sud', 'Sud-Ouest', 'Traversant')) return 0.02; if (same(x, 'Nord', 'Nord-Est')) return -0.02; return null; }),

// Contexte partagé par toutes les règles.
function ajustCtx(d) {
  const b = (d && d.bien) || {};
  const t = (d && d.client && d.client.type) || '';
  return {
    type: t === 'Appartement' ? 'appartement' : t === 'Maison' ? 'maison' : null,
    S: ajustNum(b.carrez) || ajustNum(b.habitable),
  };
}

// Calcule l'estimation ajustée. options : {dvf, surface, type} pour forcer une valeur.
function computeAjust(d, options) {
  const o = options || {};
  const ctx = ajustCtx(d || {});
  if (o.surface !== undefined) ctx.S = ajustNum(o.surface);
  if (o.type !== undefined) ctx.type = o.type;
  const dvf = o.dvf !== undefined ? o.dvf : ((d && d.dvf) || null);
  const A = (d && d.ajust) || {};
  const over = A.over || {};
  const off = Array.isArray(A.off) ? A.off : [];
  const rows = [];
  for (const r of RULES) {
    if (off.includes(r.id)) continue;
    const custom = over[r.id];
    const customOn = custom !== undefined && custom !== null && custom !== '';
    const p = customOn ? ajustNum(custom) : r.pct(d || {}, ctx);
    if (p == null || p === 0) continue;
    const capped = Math.abs(p) > CAP_COEF;
    rows.push({ id: r.id, group: r.group, label: r.label, why: r.why, pct: clampUnit(p, CAP_COEF), capped, custom: customOn });
  }
  const somme = rows.reduce((s, r) => s + r.pct, 0);
  const manuel = clampUnit(ajustNum(A.manuel) || 0, CAP_MANUEL);
  const brut = somme + manuel;
  const total = clampUnit(brut, CAP_TOTAL);
  const cappedTotal = Math.abs(brut) > CAP_TOTAL + 1e-9;
  const median = ajustNum(dvf && dvf.median);
  const q1 = ajustNum(dvf && dvf.q1);
  const q3 = ajustNum(dvf && dvf.q3);
  const facteur = 1 + total;
  const S = ctx.S;
  const m2 = median ? Math.round(median * facteur) : null;
  const valeur = (m2 && S) ? Math.round(m2 * S) : null;
  const valeurMediane = (median && S) ? Math.round(median * S) : null;
  const bas = (q1 && S) ? Math.round(q1 * facteur * S) : null;
  const haut = (q3 && S) ? Math.round(q3 * facteur * S) : null;
  const manquants = CHAMPS_UTILES.filter(([, , get]) => { const v = get(d || {}); return v === '' || v == null || v === false; }).map(([, label]) => label);
  return {
    version: AJUST_VERSION,
    type: ctx.type, surface: S,
    rows, somme, manuel, total, cappedTotal,
    median, m2, valeur, valeurMediane,
    bas, haut,
    delta: (valeur != null && valeurMediane != null) ? valeur - valeurMediane : null,
    ecartPct: median ? facteur - 1 : null,
    manquants,
    ok: !!(median && S),
  };
}

// ---- js/snap.js ----
// Module instantanés — sauvegarde automatique, silencieuse et locale (IndexedDB).
// Objectif : ne plus rien demander à l'utilisateur, et pouvoir revenir en arrière après
// une fausse manœuvre (dossier supprimé, restauration écrasante, stockage corrompu).
// LIMITE ASSUMÉE : un instantané vit dans le navigateur de cet appareil. Il ne protège pas
// d'une perte du téléphone, d'une réinitialisation ni d'un « vider les données du site ».
const SNAP_DB = 'estimo-snap';
const SNAP_STORE = 'snapshots';
const SNAP_MAX = 8;          // nombre d'instantanés conservés
const SNAP_WITH_MEDIAS = 2;  // seuls les plus récents gardent les photos
const SNAP_NOTE = 'Instantanés automatiques conservés sur cet appareil, sans action de votre part.';

function snapSupported() {
  try { return typeof indexedDB !== 'undefined' && !!indexedDB; } catch (e) { return false; }
}

// Rétention : trie du plus récent au plus ancien et ne garde que les max premiers.
function keepLastN(items, max) {
  return items.slice().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, max);
}

// Retire les photos d'un dossier pour alléger les instantanés anciens (localStorage les garde).
function stripMedias(d) {
  const medias = Array.isArray(d.medias) ? d.medias : [];
  return { ...d, medias: [], _mediasStripped: true, _mediasCount: medias.length };
}

// Remet un dossier restauré dans un état propre (les marqueurs internes ne doivent pas traîner).
function cleanDossier(d) {
  if (!d || !d._mediasStripped) return d;
  const c = { ...d, medias: Array.isArray(d.medias) ? d.medias : [] };
  delete c._mediasStripped; delete c._mediasCount;
  return c;
}

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(SNAP_DB, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(SNAP_STORE)) db.createObjectStore(SNAP_STORE, { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error || new Error('IndexedDB indisponible'));
  });
}
function req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

async function getAll(db) { return req(db.transaction(SNAP_STORE, 'readonly').objectStore(SNAP_STORE).getAll()); }
async function putOne(db, rec) { return req(db.transaction(SNAP_STORE, 'readwrite').objectStore(SNAP_STORE).put(rec)); }
async function delOne(db, id) { return req(db.transaction(SNAP_STORE, 'readwrite').objectStore(SNAP_STORE).delete(id)); }
async function getOne(db, id) { return req(db.transaction(SNAP_STORE, 'readonly').objectStore(SNAP_STORE).get(id)); }

// Enregistre un instantané de la liste complète. Silencieux : aucune interaction, aucun fichier.
// Renvoie le résumé écrit, ou null si IndexedDB n'est pas disponible.
async function putSnapshot(list) {
  if (!snapSupported() || !Array.isArray(list)) return null;
  const db = await openDB();
  const at = Date.now();
  const rec = {
    id: 's' + at.toString(36) + Math.random().toString(36).slice(2, 6),
    at, nb: list.length,
    photos: list.reduce((s, d) => s + ((d.medias && d.medias.length) || 0), 0),
    dossiers: list,
  };
  await putOne(db, rec);
  // Rétention : on ne garde que SNAP_MAX instantanés, photos seulement sur les plus récents.
  const all = keepLastN(await getAll(db), SNAP_MAX);
  for (let i = 0; i < all.length; i++) {
    const s = all[i];
    if (i >= SNAP_WITH_MEDIAS && !s._stripped) {
      const light = { ...s, dossiers: (s.dossiers || []).map(stripMedias), _stripped: true };
      await putOne(db, light);
    }
  }
  const total = await getAll(db);
  const gardes = new Set(all.map((s) => s.id));
  for (const s of total) if (!gardes.has(s.id)) await delOne(db, s.id);
  return { id: rec.id, at, nb: rec.nb, photos: rec.photos, size: estSize(rec) };
}

async function listSnapshots() {
  if (!snapSupported()) return [];
  const db = await openDB();
  return keepLastN(await getAll(db), SNAP_MAX).map((s) => ({
    id: s.id, at: s.at, nb: s.nb || (s.dossiers || []).length,
    photos: s.photos || 0, stripped: !!s._stripped, size: estSize(s),
  }));
}

async function getSnapshot(id) {
  if (!snapSupported()) return null;
  const db = await openDB();
  const s = await getOne(db, id);
  return s ? { at: s.at, dossiers: (s.dossiers || []).map(cleanDossier) } : null;
}

async function clearSnapshots() {
  if (!snapSupported()) return;
  const db = await openDB();
  for (const s of await getAll(db)) await delOne(db, s.id);
}

function estSize(o) { try { return new Blob([JSON.stringify(o)]).size; } catch (e) { return 0; } }

// Stockage : demande au navigateur de ne pas purger les données de l'application.
async function persistState() {
  try {
    if (!navigator.storage || !navigator.storage.persisted) return { supported: false, persisted: false };
    return { supported: true, persisted: await navigator.storage.persisted() };
  } catch (e) { return { supported: false, persisted: false }; }
}
async function requestPersist() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return { supported: false, persisted: false };
    return { supported: true, persisted: await navigator.storage.persist() };
  } catch (e) { return { supported: false, persisted: false }; }
}
async function storageEstimate() {
  try {
    if (!navigator.storage || !navigator.storage.estimate) return null;
    const e = await navigator.storage.estimate();
    return { usage: e.usage || 0, quota: e.quota || 0 };
  } catch (e) { return null; }
}

c.width=W;c.height=pad*2+120+lines.length*lh;g.fillStyle='#fff';g.fillRect(0,0,W,c.height);g.fillStyle='#0b1f3a';g.fillRect(0,0,W,110);g.fillStyle='#fff';g.font='bold 44px sans-serif';g.fillText('Estimo — Fiche d’estimation',pad,72);
let y=110+pad;for(const l of lines){const head=/^[A-ZÉÈ’ ()]{4,}$/.test(l.trim());g.font=(head?'bold ':'')+`${fs}px sans-serif`;g.fillStyle=head?'#1d3f73':'#0b1f3a';g.fillText(l,pad,y);y+=lh}
return new Promise(r=>c.toBlob(b=>r(b),'image/png'))}

useEffect(()=>{requestPersist().then(p=>setPersisted(p.persisted)).catch(()=>{});refreshSnaps()},[]);
useEffect(()=>{if(!list.length)return;const t=setTimeout(()=>{putSnapshot(list).then(()=>refreshSnaps()).catch(()=>{})},2500);return()=>clearTimeout(t)},[list]);
useEffect(()=>{const f=()=>{if(document.visibilityState==='hidden'){try{const l=load();if(l.length)putSnapshot(l)}catch(e){}}};document.addEventListener('visibilitychange',f);return()=>document.removeEventListener('visibilitychange',f)},[]);
const commit=(l)=>{if(save(l)){setList(l);return true}return false};
const restore=async(file)=>{try{const inc=await readBackup(file);const m=mergeDossiers(list,inc);
 if(!save(m.list))return 'Stockage plein : restauration impossible.';setList(m.list);refreshSnaps();
 return m.added+' dossier(s) ajouté(s), '+m.upd+' mis à jour, '+m.list.length+' au total ✓'}catch(e){return 'Restauration impossible : '+e.message}};
const restoreSnap=async(id)=>{try{const s=await getSnapshot(id);if(!s)return 'Copie introuvable.';const m=mergeDossiers(list,s.dossiers,{keepMedias:true});
 if(!save(m.list))return 'Stockage plein : restauration impossible.';setList(m.list);refreshSnaps();
 return m.added+' dossier(s) ajouté(s), '+m.upd+' mis à jour, '+m.list.length+' au total ✓'}catch(e){return 'Restauration impossible : '+e.message}};
const open=(id)=>{location.hash='#/d/'+id};const back=()=>{location.hash=''};
const create=()=>{const d=blank();commit([...list,d]);open(d.id)};
const d=list.find(x=>x.id===cur);const update=(fn)=>setList(l=>{const nl=l.map(x=>x.id===cur?{...fn(x),updated:Date.now()}:x);save(nl);return nl});
if(page==='parametres')return <Parametres list={list} back={back} restore={restore} backup={backup} snaps={snaps} persisted={persisted} restoreSnap={restoreSnap}/>;
return d?<Editor key={d.id} d={d} update={update} back={back}/>:<Home list={list} open={open} create={create} del={(id)=>commit(list.filter(x=>x.id!==id))} dark={dark} setDark={setDark} parametres={()=>{location.hash='#/parametres'}} snap={snap}/>}

// Filet de sécurité : une erreur de rendu ne doit pas laisser un écran blanc devant un client.
class ErrorBoundary extends React.Component{constructor(p){super(p);this.state={err:null}}
 static getDerivedStateFromError(err){return{err}}
 componentDidCatch(err,info){console.error('Estimo',err,info)}
 render(){if(!this.state.err)return this.props.children;
  const rescue=()=>{try{backup(load())}catch(e){}};
  return(<div className="max-w-2xl mx-auto px-5 py-10"><Logo size={52}/>
   <h1 className="text-xl font-extrabold mt-4 mb-2">L’application a rencontré une erreur</h1>
   <p className="text-sm opacity-80 mb-1">Vos dossiers sont toujours enregistrés sur cet appareil : ils n’ont pas été effacés.</p>
   <p className="text-xs opacity-60 mb-4">{String((this.state.err&&this.state.err.message)||this.state.err)}</p>
   <div className="flex flex-wrap gap-2"><button onClick={()=>location.reload()} className="rounded-xl px-4 py-2.5 font-semibold bg-navy-800 text-white glass-btn">Recharger</button>
   <button onClick={rescue} className="glass glass-btn rounded-xl px-4 py-2.5 font-semibold">Télécharger une sauvegarde de secours</button></div></div>)}}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);document.getElementById('boot').remove();
if('serviceWorker' in navigator)addEventListener('load',async()=>{try{
 const had=!!navigator.serviceWorker.controller;const reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
 const show=()=>{if(document.getElementById('upd'))return;const b=document.createElement('div');b.id='upd';b.setAttribute('data-testid','update');b.className='fixed top-3 inset-x-3 z-50 rounded-2xl bg-navy-800 text-white shadow-2xl p-3 flex items-center gap-3';b.innerHTML='<span class="flex-1 text-sm font-semibold">Mise à jour disponible</span><button class="rounded-xl bg-white text-navy-900 px-3 py-2 text-sm font-bold">Recharger</button>';b.querySelector('button').onclick=()=>location.reload();document.body.appendChild(b)};
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)show()});
 reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show()})});
 setInterval(()=>reg.update().catch(()=>{}),30*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
}catch(e){}});
window.ESTIMO_VERSION='2.4.0';
</script>
