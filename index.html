<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estimo – Estimation immobilière</title>
<meta name="description" content="Estimo : estimation de biens immobiliers sur la Côte d'Azur, hors ligne.">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/app.css">
<script type="module" src="./js/app.js"></script>
</head>
<body>
<header class="top no-print">
  <h1>Estimo</h1>
  <nav>
    <button data-view="form" class="active">Estimer</button>
    <button data-view="history">Historique</button>
    <button data-view="settings">Prix/m²</button>
  </nav>
</header>
<main>
<section id="view-form">
<form id="f" novalidate>
  <fieldset><legend>Bien</legend>
    <label>Adresse / référence<input name="adresse" autocomplete="off"></label>
    <label>Type de bien<select name="type"><option value="appartement">Appartement</option><option value="maison">Maison</option></select></label>
    <label>Commune / secteur<select name="secteur" id="secteur"></select></label>
    <label>Prix/m² de référence (€)<input name="prixM2" type="number" inputmode="numeric" min="500" step="10"></label>
    <label class="chk"><input type="checkbox" name="prixVerifie"> Prix/m² vérifié (DVF / ventes récentes)</label>
    <p class="note" id="srcnote"></p>
  </fieldset>
  <fieldset><legend>Surfaces & pièces</legend>
    <label>Surface habitable (m²)*<input name="surface" type="number" inputmode="decimal" min="9" step="0.01" required></label>
    <label>Pièces*<input name="pieces" type="number" inputmode="numeric" min="1" required></label>
    <label>Chambres<input name="chambres" type="number" inputmode="numeric" min="0"></label>
    <label class="maison">Terrain (m²)<input name="terrain" type="number" inputmode="numeric" min="0"></label>
    <label>Balcon (m²)<input name="balcon" type="number" inputmode="decimal" min="0"></label>
    <label>Terrasse (m²)<input name="terrasse" type="number" inputmode="decimal" min="0"></label>
    <label class="appart">Jardin privatif (m²)<input name="jardin" type="number" inputmode="decimal" min="0"></label>
  </fieldset>
  <fieldset><legend>Caractéristiques</legend>
    <label class="appart">Étage (0 = RDC)<input name="etage" type="number" inputmode="numeric" min="-1"></label>
    <label class="chk appart"><input type="checkbox" name="ascenseur"> Ascenseur</label>
    <label class="chk appart"><input type="checkbox" name="dernierEtage"> Dernier étage</label>
    <label>État<select name="etat"><option value="">— non renseigné —</option><option value="neuf">Neuf / VEFA</option><option value="refait">Refait à neuf</option><option value="bon">Bon état</option><option value="rafraichir">À rafraîchir</option><option value="travaux">Travaux importants</option><option value="renover">À rénover entièrement</option></select></label>
    <label>DPE<select name="dpe"><option value="">— non renseigné —</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option><option value="NC">Non communiqué</option></select></label>
    <label>Exposition<select name="exposition"><option value="">— non renseignée —</option><option value="sud">Sud</option><option value="sud-ouest">Sud-ouest</option><option value="sud-est">Sud-est</option><option value="ouest">Ouest</option><option value="est">Est</option><option value="nord">Nord</option><option value="traversant">Traversant</option></select></label>
    <label>Vue<select name="vue"><option value="">— non renseignée —</option><option value="mer">Mer panoramique</option><option value="mer-partielle">Mer partielle</option><option value="degagee">Dégagée</option><option value="jardin">Sur jardin</option><option value="standard">Standard</option><option value="vis-a-vis">Vis-à-vis</option></select></label>
    <label>Stationnement<select name="parking"><option value="aucun">Aucun</option><option value="exterieur">Place extérieure</option><option value="box">Box fermé</option><option value="garage">Garage</option></select></label>
    <label class="chk"><input type="checkbox" name="piscine"> Piscine</label>
    <label>Année de construction<input name="annee" type="number" inputmode="numeric" min="1600"></label>
    <label class="appart">Charges copro (€/an)<input name="charges" type="number" inputmode="numeric" min="0"></label>
    <label>Coefficient manuel agent (0,70–1,30)<input name="coefManuel" type="number" step="0.01" min="0.7" max="1.3" placeholder="1"></label>
  </fieldset>
  <div class="actions no-print">
    <button type="submit" class="primary">Calculer</button>
    <button type="button" id="reset">Nouveau</button>
  </div>
</form>
<div id="errors" role="alert"></div>
<section id="result" hidden></section>
</section>
<section id="view-history" hidden><h2>Historique</h2><div id="hist"></div></section>
<section id="view-settings" hidden><h2>Prix/m² par secteur</h2><p class="note" id="srcnote2"></p><div id="sect"></div>
<div class="actions"><button id="saveSect" class="primary">Enregistrer</button><button id="resetSect">Valeurs par défaut</button></div></section>
</main>
<footer class="no-print"><small>Estimo v2 – estimation indicative, ne remplace pas un avis de valeur argumenté.</small></footer>
</body>
</html>
