<script>
/* ===== Moteur DVF (copie générée depuis js/dvf.js — ne pas éditer ici) ===== */
// ---- js/dvf.js ----
// Module DVF — prix/m² à proximité. Source principale : fichiers Etalab geo-dvf précalculés en JSON par commune
// (data/dvf/<dep>/, servis par le site lui-même, cf. tools/build-dvf.py). Repli : API Cerema « DVF open data » (CORS ouvert).
// Logique pure (filtres, médiane, IQR) testable sous Node ; fonctions réseau isolées.
const GEOCODE_URL = 'https://api-adresse.data.gouv.fr/search/';
const LOCAL_BASE = new URL('data/dvf/', document.baseURI).href;
const SOURCE_LABEL = 'DVF Etalab (geo-dvf)';
// Date de la vente la plus récente publiée dans data/dvf/ — réécrite par tools/build-dvf.py.
const DATA_CUTOFF = '2025-12-31';
const FALLBACK_LABEL = 'DVF (Cerema / DGFiP), source de secours';
const DVF_URL = 'https://apidf-preprod.cerema.fr/dvf_opendata/geomutations/';
// codtypbien Cerema : 111 = une maison, 121 = un appartement (mutation d'un seul logement).
const TYPE_CODES = { appartement: '121', maison: '111' };
const MAX_TILE = 0.019; // l'API refuse une emprise > 0,02° × 0,02°
const RADIUS_STEPS = [300, 500, 750, 1000, 1500, 2000];
const MIN_COMPARABLES = 8;

const R = 6371000;
function distance(lat1, lon1, lat2, lon2) {
  const t = Math.PI / 180, dLat = (lat2 - lat1) * t, dLon = (lon2 - lon1) * t;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * t) * Math.cos(lat2 * t) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function centroid(geom) {
  if (!geom) return null;
  if (geom.type === 'Point') return { lon: geom.coordinates[0], lat: geom.coordinates[1] };
  const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.type === 'MultiPolygon' ? geom.coordinates : [];
  let sx = 0, sy = 0, n = 0;
  for (const p of polys) for (const [x, y] of p[0] || []) { sx += x; sy += y; n++; }
  return n ? { lon: sx / n, lat: sy / n } : null;
}
function bboxTiles(lat, lon, radius) {
  lat = Number(lat); lon = Number(lon);
  const dLat = radius / 111320, dLon = radius / (111320 * Math.cos(lat * Math.PI / 180));
  const [w, s, e, n] = [lon - dLon, lat - dLat, lon + dLon, lat + dLat];
  const nx = Math.ceil((e - w) / MAX_TILE), ny = Math.ceil((n - s) / MAX_TILE);
  const sx = (e - w) / nx, sy = (n - s) / ny, out = [];
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) out.push([w + i * sx, s + j * sy, w + (i + 1) * sx, s + (j + 1) * sy].map((v) => v.toFixed(5)));
  return out;
}
function quantile(sorted, q) {
  if (!sorted.length) return NaN;
  const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}
const median = (arr) => quantile([...arr].sort((a, b) => a - b), 0.5);
// Exclusion des valeurs aberrantes par la règle de Tukey (1,5 × IQR).
function iqrFilter(values, k = 1.5) {
  const s = [...values].sort((a, b) => a - b);
  if (s.length < 4) return { kept: s, low: -Infinity, high: Infinity, removed: 0 };
  const q1 = quantile(s, 0.25), q3 = quantile(s, 0.75), iqr = q3 - q1;
  const low = q1 - k * iqr, high = q3 + k * iqr;
  const kept = s.filter((v) => v >= low && v <= high);
  return { kept, low, high, removed: s.length - kept.length };
}
// Feature GeoJSON Cerema -> vente normalisée
function normalize(f, subject) {
  const p = f.properties || {};
  const c = centroid(f.geometry);
  const prix = Number(p.valeurfonc), surface = Number(p.sbati);
  if (!c || !(prix > 0) || !(surface > 0)) return null;
  return {
    id: p.idmutinvar || p.idopendata, date: p.datemut, prix, surface, prixM2: prix / surface,
    type: p.codtypbien === '111' ? 'maison' : p.codtypbien === '121' ? 'appartement' : 'autre',
    nature: p.libnatmut, vefa: !!p.vefa, parcelle: (p.l_idpar || [])[0] || '', terrain: Number(p.sterr) || 0,
    lat: c.lat, lon: c.lon, distance: subject ? Math.round(distance(subject.lat, subject.lon, c.lat, c.lon)) : null,
  };
}
// Sélection des comparables : même type, ventes récentes, rayon, surface proche, bornes de plausibilité.
function selectComparables(sales, { type, surface, radius, sinceDate, surfaceTol = 0.35 }) {
  return sales.filter((s) => s && s.type === type && /^Vente/.test(s.nature || 'Vente')
    && (!sinceDate || s.date >= sinceDate) && (radius == null || s.distance <= radius)
    && (!surface || (s.surface >= surface * (1 - surfaceTol) && s.surface <= surface * (1 + surfaceTol)))
    && s.prixM2 >= 300 && s.prixM2 <= 60000);
}
function stats(comps) {
  const f = iqrFilter(comps.map((c) => c.prixM2));
  const kept = comps.filter((c) => c.prixM2 >= f.low && c.prixM2 <= f.high);
  const s = f.kept;
  return { n: kept.length, removed: f.removed, median: Math.round(quantile(s, 0.5)), q1: Math.round(quantile(s, 0.25)), q3: Math.round(quantile(s, 0.75)),
    min: Math.round(s[0]), max: Math.round(s[s.length - 1]), kept, outliers: comps.filter((c) => !kept.includes(c)) };
}
// Élargissement automatique : rayon puis tolérance de surface, jusqu'à MIN_COMPARABLES.
function analyse(sales, { type, surface, radius = 500, sinceDate, min = MIN_COMPARABLES, autoWiden = true }) {
  const radii = autoWiden ? [radius, ...RADIUS_STEPS.filter((r) => r > radius)] : [radius];
  const tols = autoWiden ? [0.35, 0.6, Infinity] : [0.35];
  let best = null;
  for (const tol of tols) for (const r of radii) {
    const comps = selectComparables(sales, { type, surface: tol === Infinity ? 0 : surface, radius: r, sinceDate, surfaceTol: tol });
    const st = comps.length ? stats(comps) : { n: 0, removed: 0, kept: [], outliers: [] };
    best = { ...st, radius: r, surfaceTol: tol, widened: r !== radius || tol !== 0.35 };
    if (st.n >= min) return best;
  }
  return best;
}
function sinceDate(years = 3, now = new Date()) {
  const d = new Date(now); d.setFullYear(d.getFullYear() - years); return d.toISOString().slice(0, 10);
}

// Ligne compacte Etalab [date, prix, surface, type, lat, lon, terrain, vefa, parcelle] -> vente normalisée
function normalizeRow(r, subject, commune = '') {
  const [date, prix, surface, t, lat, lon, terrain, vefa, parcelle] = r;
  if (!(prix > 0) || !(surface > 0)) return null;
  return { id: `${commune}-${date}-${parcelle}-${prix}-${surface}`, date, prix, surface, prixM2: prix / surface,
    type: t === 'm' ? 'maison' : t === 'a' ? 'appartement' : 'autre', nature: vefa ? "Vente en l'état futur d'achèvement" : 'Vente', vefa: !!vefa,
    parcelle: parcelle || '', terrain: terrain || 0, lat, lon, distance: subject ? Math.round(distance(subject.lat, subject.lon, lat, lon)) : null };
}
// Communes dont l'emprise (bbox des ventes) élargie du rayon contient le point.
function communesNear(index, lat, lon, radius) {
  const dLat = radius / 111320, dLon = radius / (111320 * Math.cos(lat * Math.PI / 180));
  return Object.entries(index.communes || {}).filter(([, c]) => { const [w, s, e, n] = c.bbox; return lon >= w - dLon && lon <= e + dLon && lat >= s - dLat && lat <= n + dLat; }).map(([k]) => k);
}
const depOf = (citycode) => (!citycode ? '06' : /^97/.test(citycode) ? citycode.slice(0, 3) : citycode.slice(0, 2));

// ---------- Réseau ----------
async function geocode(q, { limit = 5, fetchFn = fetch } = {}) {
  const r = await fetchFn(`${GEOCODE_URL}?q=${encodeURIComponent(q)}&limit=${limit}`);
  if (!r.ok) throw new Error(`Géocodage indisponible (${r.status})`);
  const j = await r.json();
  return (j.features || []).map((f) => ({ label: f.properties.label, city: f.properties.city, citycode: f.properties.citycode, score: f.properties.score, lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1] }));
}
// GET JSON avec 2 nouvelles tentatives (l'API Cerema est parfois lente ou coupe la connexion).
async function getJson(url, fetchFn, tries = 3) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetchFn(url, { cache: 'no-store' });
      if (r.ok) return await r.json();
      last = new Error(`API DVF indisponible (${r.status})`);
      if (r.status < 500 && r.status !== 429) break;
    } catch (e) { last = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 800 * (i + 1)));
  }
  throw last;
}
async function fetchTile(t, { minYear, type, fetchFn, lat, lon, seen, onProgress }) {
  let url = `${DVF_URL}?in_bbox=${t.join(',')}&anneemut_min=${minYear}&codtypbien=${TYPE_CODES[type]}&page_size=500`;
  for (let guard = 0; url && guard < 20; guard++) {
    const j = await getJson(url, fetchFn);
    for (const f of j.features || []) { const s = normalize(f, { lat, lon }); if (s && !seen.has(s.id)) seen.set(s.id, s); }
    onProgress?.(seen.size);
    url = j.next ? j.next.replace(/^http:/, 'https:') : null;
  }
}
const jsonCache = new Map();
async function getLocal(url, fetchFn) {
  if (!jsonCache.has(url)) jsonCache.set(url, (async () => { const r = await fetchFn(url); if (!r.ok) throw new Error(`Données DVF Etalab indisponibles (${r.status})`); return r.json(); })().catch((e) => { jsonCache.delete(url); throw e; }));
  return jsonCache.get(url);
}
async function fetchSalesLocal({ lat, lon, radius, type, citycode, years = 3, fetchFn = fetch, onProgress, base = LOCAL_BASE }) {
  const dep = depOf(citycode);
  const index = await getLocal(`${base}${dep}/index.json`, fetchFn);
  const codes = communesNear(index, lat, lon, radius);
  if (citycode && index.communes?.[citycode] && !codes.includes(citycode)) codes.push(citycode);
  if (!codes.length) throw new Error('Adresse hors de la zone couverte par les données DVF Etalab');
  const minYear = String(new Date().getFullYear() - years), out = [];
  for (const j of await Promise.all(codes.map((c) => getLocal(`${base}${dep}/${c}.json`, fetchFn)))) {
    for (const r of j.rows) { if (r[0].slice(0, 4) < minYear) continue; const s = normalizeRow(r, { lat, lon }, j.commune); if (s && s.type === type && s.distance <= radius) out.push(s); }
    onProgress?.(out.length);
  }
  return { sales: out, lastSale: index.derniere_vente || out.reduce((m, s) => (s.date > m ? s.date : m), '') };
}
async function fetchSales({ lat, lon, radius, type, years = 3, fetchFn = fetch, onProgress }) {
  const minYear = new Date().getFullYear() - years;
  const seen = new Map();
  await Promise.all(bboxTiles(lat, lon, radius).map((t) => fetchTile(t, { minYear, type, fetchFn, lat, lon, seen, onProgress })));
  return [...seen.values()];
}
// Recherche complète : rayon demandé d'abord, puis élargissement (rayon, puis tolérance de surface) si trop peu de ventes.
// Source Etalab (fichiers locaux) ; l'API Cerema n'est interrogée que si cette source échoue.
async function priceNear({ lat, lon, type, surface, citycode, radius = 500, years = 3, autoWiden = true, fetchFn = fetch, onProgress, base }) {
  const since = sinceDate(years);
  const maxR = autoWiden ? Math.max(radius, 2000) : radius;
  try {
    const { sales } = await fetchSalesLocal({ lat, lon, radius: maxR, type, citycode, years, fetchFn, onProgress, base });
    const res = analyse(sales, { type, surface, radius, sinceDate: since, autoWiden });
    const lastSale = res.kept.reduce((m, s) => (s.date > m ? s.date : m), '');
    return { ...res, requestedRadius: radius, fetched: sales.length, since, lastSale, source: SOURCE_LABEL, fallback: false, at: Date.now() };
  } catch (e) {
    const r = await priceNearCerema({ lat, lon, type, surface, radius, years, autoWiden, fetchFn, onProgress });
    return { ...r, fallback: true, fallbackReason: e.message };
  }
}
async function priceNearCerema({ lat, lon, type, surface, radius = 500, years = 3, autoWiden = true, fetchFn = fetch, onProgress }) {
  const since = sinceDate(years);
  let sales = await fetchSales({ lat, lon, radius, type, years, fetchFn, onProgress });
  let res = analyse(sales, { type, surface, radius, sinceDate: since, autoWiden: false });
  if (autoWiden && res.n < MIN_COMPARABLES) {
    for (const r of RADIUS_STEPS.filter((x) => x > radius)) {
      sales = await fetchSales({ lat, lon, radius: r, type, years, fetchFn, onProgress });
      res = analyse(sales, { type, surface, radius, sinceDate: since, autoWiden: true });
      if (res.n >= MIN_COMPARABLES || r >= 1500) break;
    }
  }
  const lastSale = res.kept.reduce((m, s) => (s.date > m ? s.date : m), '');
  return { ...res, requestedRadius: radius, fetched: sales.length, since, lastSale, source: FALLBACK_LABEL, at: Date.now() };
}

// ---- js/loyers.js ----
// Module loyers — Carte des loyers ANIL / Ministère du Logement (data/loyers/<dep>.json, cf. tools/build-loyers.py).
const LOYERS_BASE = new URL('data/loyers/', document.baseURI).href;
const MEUBLE_PRIME = 0.15; // hypothèse Estimo : prime meublé +15 % (la carte ne couvre que le non meublé)
// Choix de l'indicateur : maison -> mai ; appartement 1-2 pièces -> app12, 3 pièces et plus -> app3, sinon app.
function pickIndicator(c, type, pieces) {
  if (!c) return null;
  if (type === 'maison') return c.mai ? { key: 'mai', label: 'Maisons', v: c.mai } : null;
  const k = pieces >= 3 ? 'app3' : pieces >= 1 ? 'app12' : 'app';
  const key = c[k] ? k : 'app';
  return c[key] ? { key, label: { app: 'Appartements', app12: 'Appartements 1-2 pièces', app3: 'Appartements 3 pièces et plus' }[key], v: c[key] } : null;
}
// Loyer mensuel (charges comprises) et rendement brut = loyer annuel / prix de vente.
function rentEstimate(data, { citycode, type, surface, pieces, prixVente, meublePossible = true }) {
  const c = data?.communes?.[citycode];
  if (!c) throw new Error('Commune absente de la carte des loyers');
  if (!(surface > 0)) throw new Error('Surface requise');
  const ind = pickIndicator(c, type, pieces);
  if (!ind) throw new Error('Pas d’indicateur pour ce type de bien');
  const [m2, lo, hi, typpred, nbobs] = ind.v;
  const vide = Math.round(m2 * surface), meuble = meublePossible ? Math.round(m2 * surface * (1 + MEUBLE_PRIME)) : null;
  const rdt = (l) => (prixVente > 0 && l ? (l * 12) / prixVente : null);
  return { commune: c.nom, citycode, indicateur: ind.label, m2, bas: Math.round(lo * surface), haut: Math.round(hi * surface), loM2: lo, hiM2: hi,
    vide, meuble, rendementVide: rdt(vide), rendementMeuble: rdt(meuble), prixVente: prixVente || null, typpred, nbobs,
    encadrement: !!c.encadrement, encadrementNote: data.encadrement_note, source: data.source, annee: data.annee, reference: data.reference };
}

// ---- js/ajust.js ----
// Module ajustement — traduit les champs qualitatifs saisis par l'agent en coefficients
// explicites appliqués à la médiane DVF (€/m²). Pur : aucun DOM, testé par tests/ajust.test.mjs.
//
// MÉTHODE ET LIMITE, à ne pas masquer : la médiane DVF décrit le marché d'un rayon donné,
// toutes qualités confondues — elle contient donc déjà l'état moyen des biens vendus.
// Les coefficients ci-dessous ne remplacent pas cette réalité : ils mesurent un écart
// raisonnablement documenté par rapport au bien moyen du secteur.
// D'où deux garde-fous : chaque ligne est bornée à ±8 %, le total à ±20 %.
const AJUST_VERSION = 1;
const CAP_TOTAL = 0.2;   // dérive maximale de la valeur finale vs médiane DVF
const CAP_COEF = 0.08;   // dérive maximale d'une ligne
const CAP_MANUEL = 0.1;  // positionnement libre de l'agent

function ajustNum(v) {
  if (v === true) return 1;
  if (v === false || v == null || v === '') return null;
  const x = parseFloat(String(v).replace(',', '.').replace(/\s/g, ''));
  return Number.isFinite(x) ? x : null;
}
function clampUnit(x, c) { return Math.max(-c, Math.min(c, x)); }
function same(v, ...opts) { return opts.includes(String(v || '').trim()); }

const AJR = (id, group, label, why, pct) => ({ id, group, label, why, pct });

const RULES = [
  // ---- Le bien ----
  AJR('etage', 'Bien', 'Étage élevé',
    'Au-dessus du 2e, étage élevé = calme et vue ; écart constaté sur les ventes du secteur.',
    (d, c) => { if (c.type !== 'appartement') return null; const e = ajustNum(d.bien && d.bien.etage); if (e == null || e < 3) return null; return e >= 5 ? 0.04 : 0.02; }),
  AJR('rdc', 'Bien', 'Rez-de-chaussée',
    'Un rez-de-chaussée se commercialise moins bien : sécurité, vis-à-vis, lumière.',
    (d, c) => { if (c.type !== 'appartement') return null; const e = ajustNum(d.bien && d.bien.etage); return e === 0 ? -0.05 : null; }),
  AJR('sansasc', 'Bien', 'Sans ascenseur (étage ≥ 2)',
    'L\'absence d\'ascenseur pénalise les étages hauts, en particulier au-delà du 2e.',
    (d, c) => { if (c.type !== 'appartement') return null; const e = ajustNum(d.bien && d.bien.etage); if (e == null || e < 2) return null; return (d.bien && d.bien.ascenseur) ? null : -0.04; }),
  AJR('terrasse', 'Bien', 'Terrasse',
    'La terrasse est le premier critère de prime sur la Côte d\'Azur, devant le balcon.',
    (d) => { const t = ajustNum(d.bien && d.bien.terrasse); if (t == null) return null; if (t >= 8) return 0.04; if (t >= 3) return 0.02; return null; }),
  AJR('balcon', 'Bien', 'Balcon',
    'Un balcon compte, mais moins qu\'une terrasse : pas de cumul si une terrasse est déjà primée.',
    (d) => { const b = ajustNum(d.bien && d.bien.balcon); const t = ajustNum(d.bien && d.bien.terrasse); if (b == null || b < 3) return null; if (t != null && t >= 8) return null; return 0.015; }),
  AJR('jardin', 'Bien', 'Jardin',
    'Sur une maison, le jardin privatif pèse sur le prix au m² bâti.',
    (d, c) => { if (c.type !== 'maison') return null; const j = ajustNum(d.bien && d.bien.jardin); if (j == null) return null; if (j >= 100) return 0.03; if (j >= 30) return 0.015; return null; }),
  AJR('cave', 'Bien', 'Cave / annexes',
    'Une cave ou un cellier est un plus attendu, mais marginal sur le prix au m².',
    (d) => { const v = ajustNum(d.bien && d.bien.cave); return v != null && v >= 3 ? 0.01 : null; }),
  AJR('surface', 'Bien', 'Effet de taille',
    'Les petits logements se vendent plus cher au m², les grands moins cher : effet mesurable sur DVF.',
    (d, c) => { const s = c.S; if (s == null) return null; if (s < 35) return 0.05; if (s < 50) return 0.02; if (s > 120) return -0.03; if (s > 90) return -0.015; return null; }),
  // ---- L'environnement ----
  AJR('expo', 'Environnement', 'Exposition',
    'Plein sud ou traversant : lumière et confort de vie, argument de vente récurrent.',
    (d) => { const x = d.bien && d.bien.exposition; if (same(x, 'Sud', 'Sud-Ouest', 'Traversant')) return 0.02; if (same(x, 'Nord', 'Nord-Est')) return -0.02; return null; }),
  AJR('visavis', 'Environnement', 'Vis-à-vis',

const CHAMPS_UTILES = [
  ['dpe', 'DPE', (d) => d.technique && d.technique.dpe],
  ['exposition', 'exposition', (d) => d.bien && d.bien.exposition],
  ['vue', 'vue', (d) => d.bien && d.bien.vue],
  ['bruit', 'bruit', (d) => d.bien && d.bien.bruit],
  ['etage', 'étage', (d) => d.bien && d.bien.etage],
  ['isolation', 'isolation', (d) => d.technique && d.technique.isolation],
  ['parking', 'stationnement', (d) => d.technique && d.technique.parking],
  ['terrasse', 'terrasse / balcon', (d) => (d.bien && d.bien.terrasse) || (d.bien && d.bien.balcon)],
];

// Contexte partagé par toutes les règles.
function ajustCtx(d) {
  const b = (d && d.bien) || {};
  const t = (d && d.client && d.client.type) || '';
  return {
    type: t === 'Appartement' ? 'appartement' : t === 'Maison' ? 'maison' : null,
    S: ajustNum(b.carrez) || ajustNum(b.habitable),
  };
}

// Calcule l'estimation ajustée. options : {dvf, surface, type} pour forcer une valeur.
function computeAjust(d, options) {
  const o = options || {};
  const ctx = ajustCtx(d || {});
  if (o.surface !== undefined) ctx.S = ajustNum(o.surface);
  if (o.type !== undefined) ctx.type = o.type;
  const dvf = o.dvf !== undefined ? o.dvf : ((d && d.dvf) || null);
  const A = (d && d.ajust) || {};
  const over = A.over || {};
  const off = Array.isArray(A.off) ? A.off : [];
  const rows = [];
  for (const r of RULES) {
    if (off.includes(r.id)) continue;
    const custom = over[r.id];
    const customOn = custom !== undefined && custom !== null && custom !== '';
    const p = customOn ? ajustNum(custom) : r.pct(d || {}, ctx);
    if (p == null || p === 0) continue;
    const capped = Math.abs(p) > CAP_COEF;
    rows.push({ id: r.id, group: r.group, label: r.label, why: r.why, pct: clampUnit(p, CAP_COEF), capped, custom: customOn });
  }
  const somme = rows.reduce((s, r) => s + r.pct, 0);
  const manuel = clampUnit(ajustNum(A.manuel) || 0, CAP_MANUEL);
  const brut = somme + manuel;
  const total = clampUnit(brut, CAP_TOTAL);
  const cappedTotal = Math.abs(brut) > CAP_TOTAL + 1e-9;
  const median = ajustNum(dvf && dvf.median);
  const q1 = ajustNum(dvf && dvf.q1);
  const q3 = ajustNum(dvf && dvf.q3);
  const facteur = 1 + total;
  const S = ctx.S;
  const m2 = median ? Math.round(median * facteur) : null;
  const valeur = (m2 && S) ? Math.round(m2 * S) : null;
  const valeurMediane = (median && S) ? Math.round(median * S) : null;
  const bas = (q1 && S) ? Math.round(q1 * facteur * S) : null;
  const haut = (q3 && S) ? Math.round(q3 * facteur * S) : null;
  const manquants = CHAMPS_UTILES.filter(([, , get]) => { const v = get(d || {}); return v === '' || v == null || v === false; }).map(([, label]) => label);
  return {
    version: AJUST_VERSION,
    type: ctx.type, surface: S,
    rows, somme, manuel, total, cappedTotal,
    median, m2, valeur, valeurMediane,
    bas, haut,
    delta: (valeur != null && valeurMediane != null) ? valeur - valeurMediane : null,
    ecartPct: median ? facteur - 1 : null,
    manquants,
    ok: !!(median && S),
  };
}

// ---- js/snap.js ----
// Module instantanés — sauvegarde automatique, silencieuse et locale (IndexedDB).
// Objectif : ne plus rien demander à l'utilisateur, et pouvoir revenir en arrière après
// une fausse manœuvre (dossier supprimé, restauration écrasante, stockage corrompu).
// LIMITE ASSUMÉE : un instantané vit dans le navigateur de cet appareil. Il ne protège pas
// d'une perte du téléphone, d'une réinitialisation ni d'un « vider les données du site ».
const SNAP_DB = 'estimo-snap';
const SNAP_STORE = 'snapshots';
const SNAP_MAX = 8;          // nombre d'instantanés conservés
const SNAP_WITH_MEDIAS = 2;  // seuls les plus récents gardent les photos
const SNAP_NOTE = 'Instantanés automatiques conservés sur cet appareil, sans action de votre part.';

function snapSupported() {
  try { return typeof indexedDB !== 'undefined' && !!indexedDB; } catch (e) { return false; }
}

// Rétention : trie du plus récent au plus ancien et ne garde que les max premiers.
function keepLastN(items, max) {
  return items.slice().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, max);
}

// Retire les photos d'un dossier pour alléger les instantanés anciens (localStorage les garde).
function stripMedias(d) {
  const medias = Array.isArray(d.medias) ? d.medias : [];
  return { ...d, medias: [], _mediasStripped: true, _mediasCount: medias.length };
}

// Remet un dossier restauré dans un état propre (les marqueurs internes ne doivent pas traîner).
function cleanDossier(d) {
  if (!d || !d._mediasStripped) return d;
  const c = { ...d, medias: Array.isArray(d.medias) ? d.medias : [] };
  delete c._mediasStripped; delete c._mediasCount;
  return c;
}

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(SNAP_DB, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(SNAP_STORE)) db.createObjectStore(SNAP_STORE, { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error || new Error('IndexedDB indisponible'));
  });
}
function req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

async function getAll(db) { return req(db.transaction(SNAP_STORE, 'readonly').objectStore(SNAP_STORE).getAll()); }
async function putOne(db, rec) { return req(db.transaction(SNAP_STORE, 'readwrite').objectStore(SNAP_STORE).put(rec)); }
async function delOne(db, id) { return req(db.transaction(SNAP_STORE, 'readwrite').objectStore(SNAP_STORE).delete(id)); }
async function getOne(db, id) { return req(db.transaction(SNAP_STORE, 'readonly').objectStore(SNAP_STORE).get(id)); }

// Enregistre un instantané de la liste complète. Silencieux : aucune interaction, aucun fichier.
// Renvoie le résumé écrit, ou null si IndexedDB n'est pas disponible.
async function putSnapshot(list) {
  if (!snapSupported() || !Array.isArray(list)) return null;
  const db = await openDB();
  const at = Date.now();
  const rec = {
    id: 's' + at.toString(36) + Math.random().toString(36).slice(2, 6),
    at, nb: list.length,
    photos: list.reduce((s, d) => s + ((d.medias && d.medias.length) || 0), 0),
    dossiers: list,
  };
  await putOne(db, rec);
  // Rétention : on ne garde que SNAP_MAX instantanés, photos seulement sur les plus récents.
  const all = keepLastN(await getAll(db), SNAP_MAX);
  for (let i = 0; i < all.length; i++) {
    const s = all[i];
    if (i >= SNAP_WITH_MEDIAS && !s._stripped) {
      const light = { ...s, dossiers: (s.dossiers || []).map(stripMedias), _stripped: true };
      await putOne(db, light);
    }
  }
  const total = await getAll(db);
  const gardes = new Set(all.map((s) => s.id));
  for (const s of total) if (!gardes.has(s.id)) await delOne(db, s.id);
  return { id: rec.id, at, nb: rec.nb, photos: rec.photos, size: estSize(rec) };
}

async function listSnapshots() {
  if (!snapSupported()) return [];
  const db = await openDB();
  return keepLastN(await getAll(db), SNAP_MAX).map((s) => ({
    id: s.id, at: s.at, nb: s.nb || (s.dossiers || []).length,
    photos: s.photos || 0, stripped: !!s._stripped, size: estSize(s),
  }));
}

async function getSnapshot(id) {
  if (!snapSupported()) return null;
  const db = await openDB();
  const s = await getOne(db, id);
  return s ? { at: s.at, dossiers: (s.dossiers || []).map(cleanDossier) } : null;
}

async function clearSnapshots() {
  if (!snapSupported()) return;
  const db = await openDB();
  for (const s of await getAll(db)) await delOne(db, s.id);
}

function estSize(o) { try { return new Blob([JSON.stringify(o)]).size; } catch (e) { return 0; } }

// Stockage : demande au navigateur de ne pas purger les données de l'application.
async function persistState() {
  try {
    if (!navigator.storage || !navigator.storage.persisted) return { supported: false, persisted: false };
    return { supported: true, persisted: await navigator.storage.persisted() };
  } catch (e) { return { supported: false, persisted: false }; }
}
async function requestPersist() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return { supported: false, persisted: false };
    return { supported: true, persisted: await navigator.storage.persist() };
  } catch (e) { return { supported: false, persisted: false }; }
}
async function storageEstimate() {
  try {
    if (!navigator.storage || !navigator.storage.estimate) return null;
    const e = await navigator.storage.estimate();
    return { usage: e.usage || 0, quota: e.quota || 0 };
  } catch (e) { return null; }
}

// ---- js/pdfdoc.js ----
// Module « avis de valeur » — rendu HTML paginé A4, utilisable dans l'app et sous Node.
// Pur : aucune API DOM, aucun accès réseau, aucune dépendance. Entrée = dossier Estimo + comparatif DVF.
// Source unique du document : tools/pdf/build.mjs (prototype, rendu WeasyPrint) importe ce module.
// Le texte suit le premier jet de Jane (pdf-estimation-texte-type-v1.md) : mêmes rubriques,
// mêmes formulations, variables remplies par les données réelles du dossier et de DVF.
// Les rubriques qu'aucune donnée ne peut alimenter sont affichées comme telles, jamais remplies au hasard.

const AGENCE_DEFAUT = {
  // Aucune identité réelle en dur : la marque, la carte professionnelle, la garantie
  // financière, l'assurance et le médiateur ne sont pas tranchés (cf. § 18 du texte type).
  // L'app peut injecter un bloc d'agence via buildAvis(dossier, { agence: {...} }).
  nom: null, adresse: null, tel: null, mail: null, site: null,
  raison: null, forme: null, capital: null, rcs: null, tva: null,
  carte: null, garantie: null, assurance: null, mediateur: null,
  agent: null, fonction: null, rsac: null, secteur: null,
};

const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const val = (v) => (v === '' || v == null || v === false ? 'non communiqué' : String(v));
const isSet = (v) => !(v === '' || v == null || v === false);

function renderAvis(data) {
  const H = data.helpers || makeHelpers(data);
  const AGENCE = data.agence || AGENCE_DEFAUT;
  const DEMO = data.demo !== false;
  const { dossier: D, dvf, ajust: A, score, params, SURF, visitDate } = data;
  const { eur, pct, fm } = H;
  const b = D.bien, t = D.technique, f = D.financier, c = D.client;
  const nom = [c.prenom, c.nom].filter(Boolean).join(' ');
  const adresse = c.adresse || 'Adresse non renseignée';
  const P = Number.isFinite(+f.prixAttendu) ? +f.prixAttendu : null;
  const mF = A.m2 ? (A.m2 / dvf.median - 1) : null;
  const TPAGES = 18;
  const disp = dvf.median ? (dvf.q3 - dvf.q1) / dvf.median : null;
  const lastSale = dvf.lastSale;
  const frDate = (iso) => (iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : "—");

  const ph = (label, tag = 'AGENCE') => `<span class="ph">${esc(label)} <b>${tag}</b></span>`;
  const na = (label) => `<span class="na">${esc(label)}</span>`;
  const ou = (v) => (isSet(v) && String(v).trim() !== '' ? esc(v) : `<span class="ph">à compléter <b>AGENCE</b></span>`);

  // --- Petits composants -----------------------------------------------------
  const page = (num, kicker, title, body, opts = {}) => `
  <section class="sheet${opts.cover ? ' cover' : ''}">
    ${opts.cover ? '' : `<header class="ph-head">
      <div class="brand"><svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#fff" stroke="#0b1f3a" stroke-width="4"/><path d="M12 31 32 14l20 17" fill="none" stroke="#0b1f3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 28v22h28V28" fill="none" stroke="#0b1f3a" stroke-width="5" stroke-linejoin="round"/></svg><span>ESTIMO</span></div>
      <div class="head-right">Avis de valeur · ${esc(adresse.split(',')[0])}</div>
    </header>
    <div class="pg-title"><p class="kicker">${esc(kicker)}</p><h1>${esc(title)}</h1></div>`}
    <div class="pg-body">${body}</div>
    <footer class="pg-foot"><span>${DEMO ? 'Avis de valeur · document de test, données de démonstration' : 'Avis de valeur · estimation indicative, non contractuelle'} · ${esc(D.meta_version || 'Estimo 2.4')} · DVF arrêté au ${frDate(dvf.cutoff)}</span><span>page ${num} / ${TPAGES}</span></footer>
  </section>`;

  const table = (head, rows, cls = '') => `<table class="t ${cls}"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((cell) => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  // --- Histogramme -----------------------------------------------------------
  const histo = () => {
    const W = 640, Hh = 150, pad = 26, bw = H.bins.length ? (W - pad * 2) / H.bins.length : 0;
    const max = Math.max(1, ...H.bins.map((x) => x.n));
    const bars = H.bins.map((x, i) => {
      const h = (x.n / max) * (Hh - 34);
      const cx = pad + i * bw;
      return `<rect x="${cx + 1}" y="${Hh - 24 - h}" width="${Math.max(1, bw - 2)}" height="${h}" fill="#c3d6ee" stroke="#9db8d8" stroke-width=".4" rx="1.5"/>
      <text x="${cx + bw / 2}" y="${Hh - 10}" font-size="7" text-anchor="middle" fill="#5b6b82">${x.from}</text>`;
    }).join('');
    const pos = (v) => { const lo = H.bins[0].from, hi = H.bins.at(-1).to; return pad + ((v - lo) / (hi - lo)) * (W - pad * 2); };
    const vm = pos(A.m2);
    return `<svg viewBox="0 0 ${W} ${Hh}" class="histo" role="img" aria-label="Distribution des prix au m² des ventes retenues">
      ${bars}
      <line x1="${pad}" y1="${Hh - 24}" x2="${W - pad}" y2="${Hh - 24}" stroke="#dde5ef"/>
      <line x1="${vm}" y1="6" x2="${vm}" y2="${Hh - 24}" stroke="#0f9d6e" stroke-width="1.6" stroke-dasharray="4 3"/>
      <text x="${vm + 5}" y="16" font-size="8" fill="#0f9d6e" font-weight="700">valeur retenue ${eur(A.m2)}/m²</text>
    </svg>`;
  };

  // --- Jauge du score --------------------------------------------------------
  const gauge = () => {
    const W = 620, Hh = 66, x = 20, w = W - 40;
    const p = score.total / 100;
    const cols = [[0, 0.5, '#e6b3ae'], [0.5, 0.8, '#f2d39a'], [0.8, 1, '#9fd8c1']];
    return `<svg viewBox="0 0 ${W} ${Hh}" class="gauge" role="img" aria-label="Score de confiance ${score.total} sur 100">
      ${cols.map(([a, bb, col]) => `<rect x="${x + a * w}" y="18" width="${(bb - a) * w}" height="20" fill="${col}"/>`).join('')}
      <rect x="${x + p * w - 1.5}" y="10" width="3" height="36" fill="#0b1f3a" rx="1.5"/>
      <text x="${x + p * w}" y="60" font-size="10" font-weight="700" text-anchor="middle" fill="#0b1f3a">${score.total} / 100</text>
      <text x="${x}" y="60" font-size="8" fill="#5b6b82">0</text>
      <text x="${x + 0.5 * w}" y="60" font-size="8" fill="#5b6b82" text-anchor="middle">50</text>
      <text x="${x + 0.8 * w}" y="60" font-size="8" fill="#5b6b82" text-anchor="middle">80</text>
      <text x="${x + w}" y="60" font-size="8" fill="#5b6b82" text-anchor="end">100</text>
    </svg>`;
  };

  // --- Barre de fourchette ---------------------------------------------------
  const range = () => {
    const W = 620, Hh = 78, x = 16, w = W - 32;
    const lo = A.bas, hi = A.haut, mid = A.valeur;
    const span = hi - lo || 1;
    const p = (v) => x + ((v - lo) / span) * w;
    return `<svg viewBox="0 0 ${W} ${Hh}" class="range" role="img" aria-label="Fourchette d'estimation">
      <rect x="${x}" y="22" width="${w}" height="14" rx="7" fill="#eef3f9"/>
      <rect x="${p(lo)}" y="22" width="${p(hi) - p(lo)}" height="14" rx="7" fill="#c9dbf3"/>
      <circle cx="${p(mid)}" cy="29" r="8" fill="#0f9d6e"/>
      <text x="${p(lo)}" y="16" font-size="8" text-anchor="start" fill="#5b6b82">${eur(lo)}</text>
      <text x="${p(hi)}" y="16" font-size="8" text-anchor="end" fill="#5b6b82">${eur(hi)}</text>
      <text x="${p(mid)}" y="56" font-size="9" text-anchor="middle" font-weight="700" fill="#0f9d6e">${eur(mid)}</text>
      <text x="${x}" y="72" font-size="7.5" fill="#5b6b82">valeur basse (25e percentile)</text>
      <text x="${x + w}" y="72" font-size="7.5" fill="#5b6b82" text-anchor="end">valeur haute (75e percentile)</text>
    </svg>`;
  };

  // --- Comparables -----------------------------------------------------------
  const compRow = (s, i) => {

// Adaptateur : dossier Estimo + comparatif DVF -> document prêt à imprimer.
// Rien ici ne touche au DOM : testable sous Node (tests/pdfdoc.test.mjs) et
// utilisable tel quel dans l'app (fonction exportAvis de src/app.template.html).

const PDFDOC_VERSION = '1.0';
const CUTOFF_DEFAUT = '2025-12-31'; // DATA_CUTOFF de js/dvf.js

const nOf = (v) => { const x = parseFloat(String(v ?? '').replace(',', '.').replace(/\s/g, '')); return Number.isFinite(x) ? x : null; };
const todayISO = () => new Date().toISOString().slice(0, 10);

const fmtEur = (v) => (v == null || !Number.isFinite(+v) ? '—' : Math.round(v).toLocaleString('fr-FR') + ' €');
const fmtPct = (x, signed = false) => { if (x == null) return '—'; const s = (x * 100).toFixed(1).replace('.', ','); return (signed && x >= 0 ? '+' : '') + s + ' %'; };
const fmtDateFr = (iso) => (iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '—');
const fmtMonth = (iso) => (iso ? iso.slice(0, 4) + '-' + iso.slice(5, 7) : '—');

// Histogramme des prix/m² + formateurs utilisés par le gabarit.
function makeHelpers(data) {
  const kept = (data && data.dvf && data.dvf.kept) || [];
  const vals = kept.map((s) => Number(s.prixM2)).filter((v) => v > 0);
  const bins = [];
  if (vals.length) {
    const lo = Math.floor(Math.min(...vals) / 250) * 250;
    const hi = Math.ceil(Math.max(...vals) / 250) * 250;
    for (let x = lo; x < hi; x += 250) bins.push({ from: x, to: x + 250, n: vals.filter((v) => v >= x && v < x + 250).length });
  }
  return { bins, eur: fmtEur, pct: fmtPct, fm: fmtMonth };
}

// Barème de Bob (10/11/2026), 5 critères / 100 points.
// Fraîcheur comptée depuis la date de valorisation (visite), pas depuis l'arrêt des données.
function scoreConfiance(D, dvf, A, opts) {
  const o = opts || {};
  const visitDate = o.visitDate || todayISO();
  const params = o.params || { min: 8, months: 24 };
  const b = (D && D.bien) || {}, t = (D && D.technique) || {};
  const SURF = o.SURF != null ? o.SURF : (nOf(b.carrez) || nOf(b.habitable));
  const lastSale = dvf && dvf.lastSale ? dvf.lastSale : null;
  const monthsAtVisit = lastSale ? Math.max(0, Math.round((new Date(visitDate) - new Date(lastSale)) / 2.6298e9)) : null;

  const completude = [
    ['surface', !!SURF],
    ['étage', b.etage !== '' && b.etage != null],
    ['extérieur', !!(nOf(b.terrasse) || nOf(b.balcon))],
    ['état', !!(t.notesEtat || t.travaux)],
    ['annexes', !!(nOf(b.cave) || t.parking)],
    ['DPE / GES', !!t.dpe],
  ];
  const nbChamps = completude.filter(([, ok]) => ok).length;
  const dispRaw = dvf && dvf.median ? (dvf.q3 - dvf.q1) / dvf.median : null;
  const dispPct = dispRaw == null ? null : Math.round(dispRaw * 1000) / 10;
  const large = !!dvf && dvf.n < params.min;

  const ptsN0 = dvf.n >= 20 ? 25 : dvf.n >= 12 ? 19 : dvf.n >= 8 ? 12 : dvf.n >= 5 ? 6 : 0;
  const ptsN = Math.max(0, ptsN0 - (dvf.radius > 300 ? 6 : 0));
  const ptsD0 = dispPct == null ? 0 : dispPct <= 15 ? 30 : dispPct <= 22 ? 22 : dispPct <= 30 ? 14 : dispPct <= 38 ? 7 : 0;
  const ptsD = large ? Math.min(ptsD0, 15) : ptsD0;
  const ptsF = monthsAtVisit == null ? 0 : monthsAtVisit <= 6 ? 20 : monthsAtVisit <= 12 ? 14 : monthsAtVisit <= 24 ? 8 : 3;
  const ptsC = nbChamps === 6 ? 15 : nbChamps >= 4 ? 9 : nbChamps >= 2 ? 4 : 0;
  const surfOk = !!nOf(b.carrez), dpeOk = !!t.dpe;
  const ptsQ = surfOk && dpeOk ? 10 : (surfOk || dpeOk) ? 5 : 0;
  const total = ptsN + ptsD + ptsF + ptsC + ptsQ;
  const level = total >= 75 ? 'élevé' : total >= 45 ? 'moyen' : 'faible';

  return {
    total, level, large, carrezManquant: !surfOk, bareme: 'Bob 10/11/2026',
    criteria: [
      { label: 'Comparables retenus', constat: `${dvf.n} vente(s) à ${dvf.radius} m`, pts: ptsN, max: 25 },
      { label: 'Dispersion (IQR / médiane)', constat: dispPct == null ? 'non calculable' : `${dispPct.toFixed(1).replace('.', ',')} %${large ? ' — non significative (n < 8)' : ''}`, pts: ptsD, max: 30 },
      { label: 'Fraîcheur de la dernière vente', constat: monthsAtVisit == null ? 'aucune vente' : `${monthsAtVisit} mois au ${fmtDateFr(visitDate)}`, pts: ptsF, max: 20 },
      { label: 'Complétude de la fiche', constat: `${nbChamps} champs sur 6`, pts: ptsC, max: 15 },
      { label: 'Qualité de la donnée de surface', constat: `${surfOk ? 'Carrez renseigné' : 'pas de Carrez'} · ${dpeOk ? 'DPE renseigné' : 'pas de DPE'}`, pts: ptsQ, max: 10 },
    ],
    champs: completude.map(([k, ok]) => ({ k, ok })),
    monthsAtVisit,
  };
}

// Comparatif enregistré par DvfPanel -> structure attendue par le gabarit.
// v.comps est plafonné à 40 ventes : min/max portent donc sur les 40 plus proches.
function dvfFromApp(v, opts) {
  const o = opts || {};
  const comps = ((v && v.comps) || []).map((c) => ({ date: c.date, prix: c.prix, surface: c.surface, prixM2: c.prixM2, distance: c.distance }));
  const m2s = comps.map((c) => Number(c.prixM2)).filter((x) => x > 0);
  return {
    n: v && v.n != null ? v.n : comps.length,
    removed: (v && v.removed) || 0,
    median: v && v.median, q1: v && v.q1, q3: v && v.q3,
    min: m2s.length ? Math.round(Math.min(...m2s)) : null,
    max: m2s.length ? Math.round(Math.max(...m2s)) : null,
    radius: (v && v.radius) || 300,
    kept: comps, excluded: [],
    lastSale: (v && v.lastSale) || '',
    since: (v && v.since) || '',
    cutoff: o.cutoff || (v && v.cutoff) || CUTOFF_DEFAUT,
    source: (v && v.source) || 'DVF Etalab (geo-dvf)',
    windowN: ((v && v.n) || comps.length) + ((v && v.removed) || 0),
  };
}

function avisFileName(D) {
  const c = (D && D.client) || {};
  const nom = [c.prenom, c.nom].filter(Boolean).join('-') || 'client';
  return 'avis-de-valeur-' + nom.replace(/[^\p{L}\p{N}-]+/gu, '_') + '-' + todayISO();
}

// Point d'entrée unique de l'app. opts : { ajust (obligatoire), visitDate, cutoff, min, demo, appVersion }
function buildAvis(D, opts) {
  const o = opts || {};
  const A = o.ajust;
  if (!A || !A.ok) throw new Error("Lancez d'abord le comparatif DVF et renseignez la surface : sans médiane ni surface, aucun avis de valeur ne peut être produit.");
  const visitDate = o.visitDate || todayISO();
  const v = D.dvf || {};
  const monthsRaw = v.since ? Math.round((new Date(visitDate) - new Date(v.since)) / 2.6298e9) : null;
  const params = {
    radius: v.radius || 300,
    months: monthsRaw && monthsRaw > 0 ? monthsRaw : 36,
    tol: Number.isFinite(v.surfaceTol) ? v.surfaceTol : 0.35,
    min: o.min || 8,
    ...(o.params || {}),
  };
  const dvf = dvfFromApp(v, { cutoff: o.cutoff || CUTOFF_DEFAUT });
  const score = scoreConfiance(D, dvf, A, { visitDate, params, SURF: A.surface });
  const dossier = { ...D, meta_version: o.appVersion || D.meta_version || 'Estimo 2.5' };
  const data = { dossier, dvf, ajust: A, score, params, SURF: A.surface, visitDate, demo: o.demo !== false, agence: o.agence };
  return { html: renderAvis({ ...data, helpers: makeHelpers({ dvf }) }), data, filename: avisFileName(D) };
}

window.EstimoDVF={priceNear,geocode,SOURCE_LABEL,FALLBACK_LABEL,DATA_CUTOFF,median,rentEstimate,LOYERS_BASE,MEUBLE_PRIME};

async function compress(file,w=800){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const s=Math.min(1,w/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return{data:c.toDataURL('image/jpeg',0.72),w:c.width,h:c.height}}finally{URL.revokeObjectURL(url)}}

function fiche(d){const c=d.client,b=d.bien,t=d.technique,f=d.financier,S=surfRef(d),P=n(f.prixAttendu);const L=[];const add=(k,v)=>{if(v!==''&&v!=null&&v!==false)L.push(`• ${k} : ${v===true?'oui':v}`)};
L.push('FICHE D\u2019ESTIMATION — ESTIMO','Date : '+fmtDate(Date.now()),'');
L.push('CLIENT');add('Vendeur',[c.prenom,c.nom].filter(Boolean).join(' '));add('Téléphone',c.tel);add('Email',c.email);add('Adresse du bien',c.adresse);add('Type de bien',c.type);L.push('');
L.push('BIEN');add('Surface Carrez',b.carrez&&b.carrez+' m²');add('Surface habitable',b.habitable&&b.habitable+' m²');add('Terrain',b.terrain&&b.terrain+' m²');add('Jardin',b.jardin&&b.jardin+' m²');add('Balcon',b.balcon&&b.balcon+' m²');add('Terrasse',b.terrasse&&b.terrasse+' m²');add('Cave / annexes',b.cave&&b.cave+' m²');add('Pièces',b.pieces);add('Chambres',b.chambres);add('Salles d\u2019eau / de bains',b.sdb);add('Hauteur sous plafond',b.hsp&&b.hsp+' m');add('Étage',b.etage);add('Ascenseur',b.ascenseur);add('Exposition',b.exposition);add('Vis-à-vis',b.visavis);add('Bruit',b.bruit);add('Vue',b.vue);L.push('');
L.push('TECHNIQUE');add('Chauffage',[t.chauffage,t.energie].filter(Boolean).join(' — '));add('Isolation',t.isolation);add('Menuiseries',t.menuiseries);add('DPE',t.dpe);add('Année de construction',t.annee);add('Cuisine équipée',t.cuisine);add('Stationnement',t.parking);add('Borne de recharge VE',t.borneVE);add('Climatisation',t.climatisation);add('Piscine',t.piscine);add('Travaux réalisés',t.travaux);
const w=[t.toiture&&'toiture',t.fissures&&'fissures',t.humidite&&'humidité',t.amiante&&'amiante / plomb à diagnostiquer'].filter(Boolean);add('Points d\u2019attention',w.join(', '));add('Remarques état',t.notesEtat);L.push('');
L.push('FINANCIER');add('Taxe foncière',f.taxeFonciere&&eur(n(f.taxeFonciere))+' / an');add('Charges de copropriété',f.charges&&eur(n(f.charges))+' / an');add('Motivation de vente',f.motivation);add('Délai souhaité',f.delai);add('Prix attendu',P&&eur(P));if(P&&S)add('Prix attendu au m²',eur(P/S)+' /m²');L.push('');
if(d.dvf&&d.dvf.median){const v=d.dvf;L.push('MARCHÉ (DVF)');add('Source',v.source+(v.fallback?' (secours)':''));add('Comparables',`${v.n} ventes ${v.type}s dans un rayon de ${v.radius} m du ${v.since.split('-').reverse().join('/')} au ${v.lastSale?fmtDate(v.lastSale):'—'}`);add('Prix médian',eur(v.median)+' /m²');add('Fourchette interquartile',`${eur(v.q1)} – ${eur(v.q3)} /m²`);if(S){add('Valeur indicative (médiane × surface)',eur(v.median*S));}if(P&&S)add('Écart prix attendu / médiane DVF',((P/S/v.median-1)*100).toFixed(1).replace('.',',')+' %');L.push('');}
const A=computeAjust(d);if(A.ok){L.push('ESTIMATION AJUSTÉE');add('Médiane DVF',eur(A.median)+' /m²');if(A.rows.length)add('Ajustements retenus',A.rows.map(r=>r.label+' '+ajPct(r.pct)).join(' · '));if(A.manuel)add('Positionnement de l’agent',ajPct(A.manuel));add('Total ajustement',ajPct(A.total)+(A.cappedTotal?' (plafonné)':''));add('Prix au m² ajusté',eur(A.m2)+' /m²');add('Valeur estimée',eur(A.valeur)+(A.bas&&A.haut?' — fourchette '+eur(A.bas)+' à '+eur(A.haut):''));if(P&&A.valeur)add('Écart prix attendu / estimation ajustée',((P/A.valeur-1)*100).toFixed(1).replace('.',',')+' %');L.push('');}
if(d.loyer){const l=d.loyer;L.push('LOCATIF');add('Loyer estimé vide',eur(l.vide)+' / mois charges comprises (fourchette '+eur(l.bas)+' – '+eur(l.haut)+')');if(l.meuble)add('Loyer estimé meublé',eur(l.meuble)+' / mois (hypothèse +15 %)');add('Rendement brut',pct(l.rendementVide)+' vide'+(l.meuble?' · '+pct(l.rendementMeuble)+' meublé':'')+(l.prixVente?' sur '+eur(l.prixVente):''));add('Référence',`${l.m2.toLocaleString('fr-FR')} €/m² — ${l.indicateur}, ${l.commune}`);add('Encadrement des loyers',l.encadrement?'oui, commune soumise à l’encadrement':'non applicable');add('Source',`${l.source}, ${l.annee}`);L.push('');}
if(d.medias.length)L.push(`Photos jointes au dossier : ${d.medias.length}`);L.push('Estimation indicative, non contractuelle.');return L.join('\n')}

function vcard(c){const e=(s)=>String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');return['BEGIN:VCARD','VERSION:3.0',`N:${e(c.nom)};${e(c.prenom)};;;`,`FN:${e([c.prenom,c.nom].filter(Boolean).join(' ')||'Client Estimo')}`,c.tel&&`TEL;TYPE=CELL:${e(c.tel)}`,c.email&&`EMAIL;TYPE=INTERNET:${e(c.email)}`,c.adresse&&`ADR;TYPE=HOME:;;${e(c.adresse)};;;;France`,`NOTE:${e('Vendeur — '+c.type+' (Estimo)')}`,'END:VCARD'].filter(Boolean).join('\r\n')}
function download(name,text,mime){const b=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}


const safeName=(d)=>([d.client.prenom,d.client.nom].filter(Boolean).join('-')||'client').replace(/[^\p{L}\p{N}-]+/gu,'_');
function ficheImage(txt){const lines=[];const W=1080,pad=56,fs=26,lh=38;const c=document.createElement('canvas');const g=c.getContext('2d');g.font=`${fs}px sans-serif`;
for(const raw of txt.split('\n')){let cur='';for(const w of raw.split(' ')){const t=cur?cur+' '+w:w;if(g.measureText(t).width>W-2*pad&&cur){lines.push(cur);cur=w}else cur=t}lines.push(cur)}
c.width=W;c.height=pad*2+120+lines.length*lh;g.fillStyle='#fff';g.fillRect(0,0,W,c.height);g.fillStyle='#0b1f3a';g.fillRect(0,0,W,110);g.fillStyle='#fff';g.font='bold 44px sans-serif';g.fillText('Estimo — Fiche d’estimation',pad,72);
let y=110+pad;for(const l of lines){const head=/^[A-ZÉÈ’ ()]{4,}$/.test(l.trim());g.font=(head?'bold ':'')+`${fs}px sans-serif`;g.fillStyle=head?'#1d3f73':'#0b1f3a';g.fillText(l,pad,y);y+=lh}
return new Promise(r=>c.toBlob(b=>r(b),'image/png'))}
async function shareFiche(d,say){const txt=fiche(d);const title='Fiche d’estimation Estimo';
try{if(navigator.share){let files;try{const b=await ficheImage(txt);const f=new File([b],`fiche-${safeName(d)}.png`,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))files=[f]}catch(e){}
 try{await navigator.share(files?{title,text:txt,files}:{title,text:txt});return say('Fiche partagée ✓')}catch(e){if(e.name==='AbortError')return;if(files){await navigator.share({title,text:txt});return say('Fiche partagée ✓')}}}}catch(e){}
await copyText(txt);say('Partage indisponible : fiche copiée dans le presse-papier ✓')}
async function copyText(txt){try{await navigator.clipboard.writeText(txt)}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}}
async function shareContact(d,say){const name=safeName(d)+'.vcf',txt=vcard(d.client);const f=new File([txt],name,{type:'text/vcard'});
if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Contact '+name.replace('.vcf','')});return say('Contact partagé ✓')}catch(e){if(e.name==='AbortError')return}}
download(name,txt,'text/vcard;charset=utf-8');say('Fichier contact téléchargé : ouvrez-le pour l’ajouter au carnet ✓')}
const waLink=(d)=>{const tel=(d.client.tel||'').replace(/[^\d+]/g,'').replace(/^0(\d{9})$/,'33$1').replace(/^\+/,'');return `https://wa.me/${''}?text=${encodeURIComponent(fiche(d))}`};
const mailLink=(d)=>`mailto:${encodeURIComponent(d.client.email||'')}?subject=${encodeURIComponent('Estimation de votre bien'+(d.client.adresse?' — '+d.client.adresse:''))}&body=${encodeURIComponent(fiche(d))}`;

function LoyerPanel({d,setLoyer}){const [st,setSt]=useState({});const type=dvfType(d.client.type),S=surfRef(d),L=d.loyer;
const prixVente=d.dvf&&d.dvf.median&&S?Math.round(d.dvf.median*S):n(d.financier.prixAttendu);
const run=async()=>{if(!type)return setSt({err:'L’estimation locative couvre les appartements et les maisons.'});if(!S)return setSt({err:'Renseignez une surface dans l’onglet Bien.'});if(!d.client.adresse)return setSt({err:'Renseignez l’adresse du bien.'});
setSt({busy:true});try{let code=d.dvf&&d.dvf.citycode;if(!code){const g=(await EstimoDVF.geocode(d.client.adresse,{limit:1}))[0];if(!g)throw new Error('Adresse introuvable');code=g.citycode}
const dep=code.slice(0,2);const r=await fetch(EstimoDVF.LOYERS_BASE+dep+'.json');if(!r.ok)throw new Error('Carte des loyers indisponible pour le département '+dep);
const res=EstimoDVF.rentEstimate(await r.json(),{citycode:code,type,surface:S,pieces:n(d.bien.pieces)||0,prixVente});setLoyer({...res,baseVente:d.dvf&&d.dvf.median?'médiane DVF × surface':'prix attendu'});setSt({})}catch(e){setSt({err:'Estimation locative impossible : '+e.message})}};
return(<Card title="Estimation locative"><p className="text-xs opacity-75 mb-3">Loyer au m² de la commune ({type==='maison'?'maisons':'appartements selon le nombre de pièces'}), appliqué à {S?S+' m²':'la surface'}. Rendement brut calculé sur le prix de vente estimé ({d.dvf&&d.dvf.median?'médiane DVF × surface':'prix attendu, faute de comparatif DVF'}).</p>
<Btn primary on={run} cls="w-full">{st.busy?'Calcul…':'Estimer le loyer'}</Btn>{st.err&&<p className="text-sm text-red-600 mt-2">{st.err}</p>}
{L&&<div className="mt-4" data-testid="loyer-result"><div className="grid grid-cols-2 gap-2 text-center mb-3"><div className="rounded-xl bg-navy-800 text-white p-3"><p className="text-[10px] uppercase opacity-80">Loyer vide / mois</p><p className="text-xl font-extrabold">{eur(L.vide)}</p><p className="text-[10px]">fourchette {eur(L.bas)} – {eur(L.haut)}</p></div><div className="glass rounded-xl p-3"><p className="text-[10px] uppercase opacity-70">Loyer meublé / mois</p><p className="text-xl font-extrabold">{eur(L.meuble)}</p><p className="text-[10px]">hypothèse +{Math.round(EstimoDVF.MEUBLE_PRIME*100)} %</p></div></div>
<p className="text-sm">Rendement brut : <b>{pct(L.rendementVide)}</b> vide · <b>{pct(L.rendementMeuble)}</b> meublé {L.prixVente?`(sur ${eur(L.prixVente)}, ${L.baseVente})`:'(prix de vente inconnu)'}</p>
<p className="text-sm mt-1">{L.commune} : {L.m2.toLocaleString('fr-FR')} €/m² ({L.indicateur}){L.typpred!=='commune'?' — indicateur de maille (peu d’annonces)':` — ${L.nbobs} annonces`}</p>
<p className={`text-sm mt-1 ${L.encadrement?'text-amber-600 font-semibold':''}`}>{L.encadrement?'⚠️ Commune soumise à l’encadrement des loyers : le loyer doit respecter le plafond de référence majoré.':'Encadrement des loyers : non applicable. '+L.encadrementNote}</p>
<p className="text-xs opacity-70 mt-2">Source : {L.source}, {L.annee} — {L.reference}.</p></div>}</Card>)}

 comps:r.kept.sort((a,b)=>a.distance-b.distance).slice(0,40).map(c=>({date:c.date,prix:c.prix,surface:c.surface,prixM2:Math.round(c.prixM2),distance:c.distance}))});setSt({})}catch(e){setSt({err:'Comparatif impossible : '+e.message+(navigator.onLine?'':' (hors ligne)')})}};

// Aucune donnée ne quitte le téléphone : le HTML est construit ici, puis remis au
// moteur d'impression du navigateur (« Enregistrer au format PDF »).
function avisEtat(d){const A=computeAjust(d);const v=d.dvf;const ok=!!(A.ok&&v&&v.median&&v.n>0);
 const why=!A.surface?'surface du bien manquante':!v||!v.median?'comparatif DVF non lancé':!v.n?'aucune vente comparable':'';return{A,ok,why};}
function avisDoc(d,A){return EstimoPDF.buildAvis(d,{ajust:A,cutoff:EstimoDVF.DATA_CUTOFF,demo:true,appVersion:'Estimo '+(window.ESTIMO_VERSION||'2.5')});}
function openAvis(d,mode){const{A,ok,why}=avisEtat(d);
 if(!ok)return alert('Avis de valeur indisponible : '+why+'. Lancez le comparatif DVF ci-dessous.');
 const w=window.open('','_blank');
 if(!w)return alert('Fenêtre bloquée : autorisez les fenêtres surgissantes pour Estimo, ou utilisez « Télécharger le .html ».');
 let doc;try{doc=avisDoc(d,A)}catch(e){w.close();return alert('Avis de valeur impossible : '+e.message)}
 try{w.document.open();w.document.write(doc.html);w.document.close();w.document.title=doc.filename;}catch(e){return alert('Écriture impossible : '+e.message)}
 if(mode==='print'){const go=()=>{try{w.focus();w.print()}catch(e){}};
  if(w.document.readyState==='complete')setTimeout(go,600);else w.onload=()=>setTimeout(go,400);}
}
function saveAvis(d){const{A,ok,why}=avisEtat(d);if(!ok)return alert('Avis de valeur indisponible : '+why+'.');
 try{const doc=avisDoc(d,A);download(doc.filename+'.html',doc.html,'text/html;charset=utf-8');}catch(e){alert('Avis de valeur impossible : '+e.message)}}
function AvisCard({d}){const{A,ok,why}=avisEtat(d);const v=d.dvf;
 return(<Card title="Avis de valeur (PDF)">
 {ok?<div className="rounded-xl bg-navy-800 text-white p-3 mb-3" data-testid="avis-pret"><p className="text-[10px] uppercase opacity-80">Document prêt · 18 pages A4</p><p className="text-2xl font-extrabold">{eur(A.valeur)}</p><p className="text-xs opacity-85">fourchette {eur(A.bas)} – {eur(A.haut)} · {v.n} ventes à {v.radius} m · DVF arrêté au {fmtDate(EstimoDVF.DATA_CUTOFF)}</p></div>
 :<div className="rounded-xl bg-amber-50 dark:bg-navy-900 border border-amber-300 dark:border-navy-700 p-3 mb-3 text-sm"><b>Avis de valeur indisponible.</b> Il manque : {why}. Lancez le comparatif DVF ci-dessous, puis revenez ici.</div>}
 <div className="flex flex-wrap gap-2"><Btn primary on={()=>openAvis(d,'print')} cls={ok?'':'opacity-50'}>🖨 Avis de valeur (PDF)</Btn><Btn on={()=>openAvis(d,'view')}>Aperçu</Btn><Btn on={()=>saveAvis(d)}>Télécharger le .html</Btn></div>
 <p className="text-[11px] opacity-70 mt-2">Dans la fenêtre d’impression : <b>marges « aucune », échelle 100 %, graphiques d’arrière-plan activés</b>. Tout est calculé sur cet appareil, rien n’est envoyé. Document de test : ventes DVF réelles, mise en page à valider.</p></Card>);}

// Panneau d'ajustement : rend visibles les coefficients appliqués à la médiane DVF.
function AjustPanel({d,update}){const A=computeAjust(d);const [edit,setEdit]=useState(false);
const patch=(fn)=>update(x=>({...x,ajust:{...(x.ajust||{}),...fn(x.ajust||{})}}));
const setOver=(id,v)=>patch(a=>{const o={...(a.over||{})};if(v==='')delete o[id];else o[id]=v;return{over:o}});
const setOff=(id,on)=>patch(a=>{const s=new Set(a.off||[]);if(on)s.add(id);else s.delete(id);return{off:[...s]}});
const setPct=(id,raw)=>{if(raw==='')return setOver(id,'');const v=Number(String(raw).replace(',','.'));if(!isFinite(v))return;setOver(id,String(v/100))};
const reset=()=>patch(()=>({over:{},off:[],manuel:0}));
if(!d.dvf||!d.dvf.median)return(<Card title="Estimation ajustée"><p className="text-sm opacity-80">Lancez d’abord le comparatif DVF ci-dessus : les ajustements portent sur la médiane du marché.</p></Card>);
return(<Card title="Estimation ajustée">
<div className="rounded-2xl bg-navy-800 text-white p-4 text-center" data-testid="ajust"><p className="text-xs uppercase opacity-80">Valeur estimée</p><p className="text-3xl font-extrabold">{A.valeur?eur(A.valeur):'—'}</p><p className="text-xs opacity-80">{A.m2?eur(A.m2)+' /m²':''}{A.surface?' · '+A.surface+' m²':''}</p>{A.bas&&A.haut?<p className="text-xs opacity-70 mt-1">Fourchette {eur(A.bas)} – {eur(A.haut)}</p>:null}<p className="text-xs mt-2">{A.total===0?'Aucun ajustement':ajPct(A.total)+' sur la médiane'} · médiane {eur(A.median)}/m²</p></div>
{A.delta?<p className="text-xs opacity-70 mt-2">Écart avec la médiane brute : {ajPct(A.ecartPct)} soit {A.delta>0?'+':''}{eur(A.delta)}</p>:null}
<p className="text-[11px] opacity-70 mt-3">La médiane DVF contient déjà l’état moyen des biens vendus : ces coefficients affinent un point de départ, ils ne le remplacent pas. Chaque ligne est plafonnée à ±8 %, le total à ±20 %.</p>
{A.manquants.length>0?<p className="text-xs text-amber-600 mt-2" data-testid="manquants">Pour affiner : {A.manquants.join(', ')} non renseigné(s).</p>:null}
<table className="w-full text-xs mt-3"><thead><tr className="text-left opacity-70"><th className="py-1">Ajustement</th><th className="text-right">Effet</th><th className="text-right">€/m²</th>{edit?<th/>:null}</tr></thead><tbody>
{AJ_GROUPES.map(g=>{const rows=A.rows.filter(r=>r.group===g);if(!rows.length)return null;return(<React.Fragment key={g}><tr><td colSpan={edit?4:3} className="pt-3 pb-1 text-[10px] uppercase font-bold opacity-60">{g}</td></tr>{rows.map(r=>(<tr key={r.id} className="border-t border-navy-100 dark:border-navy-800"><td className="py-1">{r.label}{r.custom?' ✎':''}{r.capped?' (plafonné)':''}</td><td className="text-right font-semibold">{ajPct(r.pct)}</td><td className="text-right">{A.median?eur(Math.round(A.median*r.pct)):'—'}</td>{edit?<td className="text-right"><button onClick={()=>setOff(r.id,true)} className="opacity-50 px-1" aria-label="Retirer">✕</button></td>:null}</tr>))}</React.Fragment>)})}
</tbody></table>
{edit?<div className="mt-3"><p className="text-[10px] uppercase font-bold opacity-60 mb-1">Coefficients en % (vide = barème automatique)</p><div className="grid grid-cols-2 gap-x-3 gap-y-1">{RULES.map(r=>{const over=(d.ajust&&d.ajust.over&&d.ajust.over[r.id]);const off=!!(d.ajust&&d.ajust.off&&d.ajust.off.includes(r.id));const auto=r.pct(d,ajustCtx(d));return(<label key={r.id} className={'flex items-center gap-1 text-[11px] '+(off?'opacity-40':'')}><input type="checkbox" checked={!off} onChange={e=>setOff(r.id,!e.target.checked)}/><span className="flex-1 truncate">{r.label}</span><input className="inp !w-14 !py-1 text-right" type="number" step="0.5" value={over!=null?String(Math.round(Number(over)*1000)/10):''} placeholder={String(Math.round((auto||0)*1000)/10)} onChange={e=>setPct(r.id,e.target.value)}/></label>)})}</div></div>:null}
<label className="block mt-4"><span className="text-[10px] uppercase font-bold opacity-60">Positionnement de l’agent : {ajPct(A.manuel)}</span><input type="range" min="-10" max="10" step="0.5" value={Math.round(A.manuel*1000)/10} onChange={e=>patch(()=>({manuel:Number(e.target.value)/100}))} className="w-full"/></label>
<p className="text-[11px] opacity-70">Réservé à votre jugement de terrain, plafonné à ±10 points. <button onClick={reset} className="underline font-semibold">Réinitialiser les ajustements</button></p>
<div className="mt-3"><Btn on={()=>setEdit(!edit)}>{edit?'Terminer':'Modifier les coefficients'}</Btn></div>
</Card>)}

// Paramètres : la sauvegarde est automatique, on n'y vient que pour restaurer ou exporter.
function Parametres({list,back,restore,backup,snaps,persisted,restoreSnap}){const [msg,setMsg]=useState('');const [smsg,setSmsg]=useState('');const ref=useRef();
const used=useMemo(()=>Math.round(new Blob([JSON.stringify(list)]).size/1024),[list]);
const dt=(t)=>t?new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
return(<div className="max-w-3xl mx-auto px-4 pb-24" style={{paddingTop:'max(env(safe-area-inset-top),1rem)'}}>
<header className="flex items-center gap-3 mb-6"><button onClick={back} className="glass glass-btn rounded-full w-11 h-11 text-lg" aria-label="Retour">←</button><h1 className="text-xl font-extrabold">Paramètres</h1></header>
<Card title="Sauvegarde automatique">
<p className="text-sm opacity-85">Vos dossiers sont copiés automatiquement sur cet appareil après chaque modification. Aucune action de votre part, aucun fichier à télécharger.</p>
<div className="grid grid-cols-2 gap-2 mt-3 text-sm"><div className="glass rounded-xl p-2"><p className="text-[10px] uppercase opacity-60">Dernière copie</p><p className="font-semibold">{dt(snaps[0]&&snaps[0].at)}</p></div><div className="glass rounded-xl p-2"><p className="text-[10px] uppercase opacity-60">Copies conservées</p><p className="font-semibold">{snaps.length} / {SNAP_MAX}</p></div><div className="glass rounded-xl p-2"><p className="text-[10px] uppercase opacity-60">Dossiers</p><p className="font-semibold">{list.length}</p></div><div className="glass rounded-xl p-2"><p className="text-[10px] uppercase opacity-60">Espace utilisé</p><p className="font-semibold">~{used} Ko</p></div></div>
<p className="text-xs mt-3" data-testid="persist">{persisted?'🔒 Stockage protégé : le navigateur ne purgera pas ces données.':'⚠️ Stockage non protégé : Safari ou Chrome peuvent effacer ces données après une longue période sans ouverture. Installez Estimo sur l’écran d’accueil (Partager → Sur l’écran d’accueil) puis rouvrez-la.'}</p>
<p className="text-[11px] opacity-70 mt-2">Ces copies restent dans cet appareil : elles ne survivent pas à une perte, un vol ou un changement de téléphone. Pour cela, exportez un fichier ci-dessous et gardez-le ailleurs.</p>
{snaps.length>0?<div className="mt-4"><p className="text-[10px] uppercase font-bold opacity-60 mb-1">Revenir à une copie</p><div className="space-y-1">{snaps.map(s=>(<div key={s.id} className="flex items-center gap-2 text-xs"><span className="flex-1">{dt(s.at)} · {s.nb} dossier(s){s.stripped?' · sans photos':''}</span><button className="glass glass-btn rounded-lg px-2 py-1 font-semibold" onClick={async()=>{if(!confirm('Restaurer la copie du '+dt(s.at)+' ? Les dossiers sont fusionnés avec ceux de cet appareil ; en cas de doublon, la version la plus récente est conservée.'))return;setSmsg(await restoreSnap(s.id))}}>Restaurer</button></div>))}</div>{smsg?<p className="text-xs font-semibold text-emerald-600 mt-1">{smsg}</p>:null}</div>:null}
</Card>
<Card title="Fichier de sauvegarde">
<p className="text-sm opacity-85">Pour changer de téléphone ou archiver vos dossiers ailleurs.</p>
<div className="flex flex-wrap gap-2 mt-3">{list.length?<Btn on={()=>{backup(list);setMsg('Sauvegarde exportée ✓')}}>Exporter les {list.length} dossier(s)</Btn>:null}<Btn on={()=>ref.current.click()}>Restaurer depuis un fichier</Btn></div>
<input ref={ref} type="file" accept="application/json,.json" className="hidden" onChange={async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!confirm('Restaurer « '+f.name+' » ? Les dossiers du fichier sont fusionnés avec ceux de cet appareil ; en cas de doublon, la version la plus récente est conservée.'))return;setMsg(await restore(f))}}/>
{msg?<p className="text-sm font-semibold text-emerald-600 mt-2" data-testid="backupmsg">{msg}</p>:null}
<p className="text-[11px] opacity-70 mt-2">Une restauration ne supprime jamais un dossier plus récent ; si le stockage est plein, elle est refusée sans rien modifier.</p>
</Card>
<Card title="À propos"><p className="text-sm">Estimo V2.5 · PWA hors ligne, sans compte ni publicité.</p><p className="text-xs opacity-70 mt-1">Comparatif DVF Etalab · ventes jusqu’au {fmtDate(EstimoDVF.DATA_CUTOFF)}. Estimation indicative, non contractuelle.</p></Card>
</div>)}

function App(){const [list,setList]=useState(load);const [cur,setCur]=useState(null);const [page,setPage]=useState('accueil');const [snap,setSnap]=useState(null);const [snaps,setSnaps]=useState([]);const [persisted,setPersisted]=useState(null);const [dark,setDark]=useState(()=>localStorage.getItem(THEME)?localStorage.getItem(THEME)==='dark':matchMedia('(prefers-color-scheme: dark)').matches);
useEffect(()=>{document.documentElement.classList.toggle('dark',dark);localStorage.setItem(THEME,dark?'dark':'light');document.querySelector('meta[name=theme-color]').content=dark?'#061226':'#0b1f3a'},[dark]);
useEffect(()=>{const h=()=>{const hs=location.hash;if(hs.startsWith('#/d/')){setCur(decodeURIComponent(hs.replace(/^#\/d\//,'')));setPage('dossier')}else if(hs==='#/parametres'){setCur(null);setPage('parametres')}else{setCur(null);setPage('accueil')}};h();addEventListener('hashchange',h);return()=>removeEventListener('hashchange',h)},[]);
// Sauvegarde automatique : instantanés silencieux, rien n'est demandé à l'utilisateur.
const refreshSnaps=async()=>{try{const s=await listSnapshots();setSnaps(s);setSnap(s[0]||null)}catch(e){}};
useEffect(()=>{requestPersist().then(p=>setPersisted(p.persisted)).catch(()=>{});refreshSnaps()},[]);
useEffect(()=>{if(!list.length)return;const t=setTimeout(()=>{putSnapshot(list).then(()=>refreshSnaps()).catch(()=>{})},2500);return()=>clearTimeout(t)},[list]);
useEffect(()=>{const f=()=>{if(document.visibilityState==='hidden'){try{const l=load();if(l.length)putSnapshot(l)}catch(e){}}};document.addEventListener('visibilitychange',f);return()=>document.removeEventListener('visibilitychange',f)},[]);
const commit=(l)=>{if(save(l)){setList(l);return true}return false};
const restore=async(file)=>{try{const inc=await readBackup(file);const m=mergeDossiers(list,inc);
 if(!save(m.list))return 'Stockage plein : restauration impossible.';setList(m.list);refreshSnaps();
 return m.added+' dossier(s) ajouté(s), '+m.upd+' mis à jour, '+m.list.length+' au total ✓'}catch(e){return 'Restauration impossible : '+e.message}};
const restoreSnap=async(id)=>{try{const s=await getSnapshot(id);if(!s)return 'Copie introuvable.';const m=mergeDossiers(list,s.dossiers,{keepMedias:true});
 if(!save(m.list))return 'Stockage plein : restauration impossible.';setList(m.list);refreshSnaps();
 return m.added+' dossier(s) ajouté(s), '+m.upd+' mis à jour, '+m.list.length+' au total ✓'}catch(e){return 'Restauration impossible : '+e.message}};
const open=(id)=>{location.hash='#/d/'+id};const back=()=>{location.hash=''};
const create=()=>{const d=blank();commit([...list,d]);open(d.id)};
const d=list.find(x=>x.id===cur);const update=(fn)=>setList(l=>{const nl=l.map(x=>x.id===cur?{...fn(x),updated:Date.now()}:x);save(nl);return nl});
if(page==='parametres')return <Parametres list={list} back={back} restore={restore} backup={backup} snaps={snaps} persisted={persisted} restoreSnap={restoreSnap}/>;
return d?<Editor key={d.id} d={d} update={update} back={back}/>:<Home list={list} open={open} create={create} del={(id)=>commit(list.filter(x=>x.id!==id))} dark={dark} setDark={setDark} parametres={()=>{location.hash='#/parametres'}} snap={snap}/>}

// Filet de sécurité : une erreur de rendu ne doit pas laisser un écran blanc devant un client.
class ErrorBoundary extends React.Component{constructor(p){super(p);this.state={err:null}}
 static getDerivedStateFromError(err){return{err}}
 componentDidCatch(err,info){console.error('Estimo',err,info)}
 render(){if(!this.state.err)return this.props.children;
  const rescue=()=>{try{backup(load())}catch(e){}};
  return(<div className="max-w-2xl mx-auto px-5 py-10"><Logo size={52}/>
   <h1 className="text-xl font-extrabold mt-4 mb-2">L’application a rencontré une erreur</h1>
   <p className="text-sm opacity-80 mb-1">Vos dossiers sont toujours enregistrés sur cet appareil : ils n’ont pas été effacés.</p>
   <p className="text-xs opacity-60 mb-4">{String((this.state.err&&this.state.err.message)||this.state.err)}</p>
   <div className="flex flex-wrap gap-2"><button onClick={()=>location.reload()} className="rounded-xl px-4 py-2.5 font-semibold bg-navy-800 text-white glass-btn">Recharger</button>
   <button onClick={rescue} className="glass glass-btn rounded-xl px-4 py-2.5 font-semibold">Télécharger une sauvegarde de secours</button></div></div>)}}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);document.getElementById('boot').remove();
if('serviceWorker' in navigator)addEventListener('load',async()=>{try{
 const had=!!navigator.serviceWorker.controller;const reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
 const show=()=>{if(document.getElementById('upd'))return;const b=document.createElement('div');b.id='upd';b.setAttribute('data-testid','update');b.className='fixed top-3 inset-x-3 z-50 rounded-2xl bg-navy-800 text-white shadow-2xl p-3 flex items-center gap-3';b.innerHTML='<span class="flex-1 text-sm font-semibold">Mise à jour disponible</span><button class="rounded-xl bg-white text-navy-900 px-3 py-2 text-sm font-bold">Recharger</button>';b.querySelector('button').onclick=()=>location.reload();document.body.appendChild(b)};
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)show()});
 reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show()})});
 setInterval(()=>reg.update().catch(()=>{}),30*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
}catch(e){}});
window.ESTIMO_VERSION='2.5.1';
</script>
</body>
</html>
