<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0b">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { accent: '#c9a96e', ink: { 800: '#1a1a1a', 900: '#0a0a0b' } } } }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-content { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .toast-enter { animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .view-enter { animation: scaleIn 0.3s ease-out forwards; }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        input[type="datetime-local"]::-webkit-calendar-picker-indicator { 
            filter: invert(0.5); 
            cursor: pointer;
        }
        .dark input[type="datetime-local"]::-webkit-calendar-picker-indicator { 
            filter: invert(1); 
        }
    </style>
</head>
<body class="bg-stone-50 dark:bg-ink-900 text-stone-800 dark:text-stone-100 antialiased font-sans overflow-x-hidden selection:bg-accent/30 selection:text-accent">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const TABS = ['client', 'bien', 'technique', 'financier', 'medias'];
        const TAB_LABELS = { client: 'Client', bien: 'Bien', technique: 'Technique', financier: 'Financier', medias: 'Médias' };

        const Field = ({ label, type = 'text', value, onChange, readOnly = false }) => (
            <label className="flex flex-col mb-4 w-full group">
                <span className="text-[11px] font-medium uppercase tracking-[0.14em] text-stone-500 dark:text-stone-500 mb-2 ml-0.5 transition-colors group-focus-within:text-accent">{label}</span>
                <input type={type} value={value} onChange={onChange} readOnly={readOnly} className={`w-full h-12 px-4 rounded-2xl text-[15px] bg-white/70 dark:bg-white/[0.04] border border-stone-200/80 dark:border-white/[0.08] text-stone-900 dark:text-stone-100 placeholder:text-stone-400 outline-none backdrop-blur-xl transition-all duration-200 focus:border-accent/70 focus:bg-white dark:focus:bg-white/[0.07] focus:ring-4 focus:ring-accent/15 ${readOnly ? 'opacity-70 cursor-not-allowed' : ''}`} />
            </label>
        );

        const SectionTitle = ({ icon, title, subtitle }) => (
            <div className="flex items-center gap-3 mb-6">
                <div className="flex items-center justify-center w-10 h-10 rounded-2xl bg-accent/10 border border-accent/20 text-accent">
                    <i data-lucide={icon} className="w-[18px] h-[18px]"></i>
                </div>
                <div>
                    <h2 className="text-lg font-semibold tracking-tight text-stone-900 dark:text-white">{title}</h2>
                    <p className="text-xs text-stone-500">{subtitle}</p>
                </div>
            </div>
        );

        function getEmptyClient() {
            return {
                id: Date.now(), date: new Date().toLocaleDateString('fr-FR'),
                nom: '', prenom: '', telephone: '', email: '', adresse: '', typeBien: 'Appartement', rdv: '',
                surfaceHabitable: '', surfaceCarrez: '', annexes: { terrasse: '', balcon: '', jardin: '', cave: '', garage: '' },
                distribution: { pieces: '', chambres: '', sainte: '', hauteurPlafond: '' },
                env: { exposition: '', visAVis: '', bruit: '' },
                chauffage: { type: '', energie: '', age: '' },
                menuiseries: { vitrage: '', fenetres: '', volets: '', isolation: '' },
                equipements: { cuisineEquipee: false, stationnement: false, climatisation: false },
                travaux: { nature: '', dates: '', factures: false },
                etat: { humidite: false, fissures: false, toiture: '', notesEtat: '' },
                charges: { fonciere: '', copro: '' },
                copro: { travauxVotes: '', ambiance: '' },
                projet: { raison: '', delai: 'Moyen', prixAttendu: '' },
                medias: []
            };
        }

        // BOUCLIER ULTRA-ROBUSTE
        function hydrateClient(data) {
            const base = getEmptyClient();
            if (!data || typeof data !== 'object') return base;
            return {
                ...base,
                ...data,
                rdv: data.rdv || '',
                annexes: { ...base.annexes, ...(data.annexes || {}) },
                distribution: { ...base.distribution, ...(data.distribution || {}) },
                env: { ...base.env, ...(data.env || {}) },
                chauffage: { ...base.chauffage, ...(data.chauffage || {}) },
                menuiseries: { ...base.menuiseries, ...(data.menuiseries || {}) },
                equipements: { ...base.equipements, ...(data.equipements || {}) },
                travaux: { ...base.travaux, ...(data.travaux || {}) },
                etat: { ...base.etat, ...(data.etat || {}) },
                charges: { ...base.charges, ...(data.charges || {}) },
                copro: { ...base.copro, ...(data.copro || {}) },
                projet: { ...base.projet, ...(data.projet || {}) },
                medias: Array.isArray(data.medias) ? data.medias : []
            };
        }

        // FORMATAGE SÉCURISÉ DES DATES
        function formatRdvDate(dateStr) {
            if (!dateStr) return 'Date non définie';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return 'Date invalide';
            return d.toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        function App() {
            const [view, setView] = useState(() => {
                const hash = window.location.hash.replace('#', '');
                if (hash === 'list') return 'list';
                if (hash === 'calendar') return 'calendar';
                if (hash === 'form') return 'form';
                return localStorage.getItem('immo_draft') ? 'form' : 'home';
            }); 
            
            // LECTURE SÉCURISÉE DE LA MÉMOIRE LOCALE
            const [clients, setClients] = useState(() => {
                const saved = localStorage.getItem('immo_clients');
                if (!saved) return [];
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        return parsed.map(hydrateClient);
                    }
                    return [];
                } catch(e) { return []; }
            });

            const [currentClient, setCurrentClient] = useState(() => {
                const draft = localStorage.getItem('immo_draft');
                if (draft) {
                    try {
                        const parsed = JSON.parse(draft);
                        if (typeof parsed === 'object') return hydrateClient(parsed);
                    } catch(e) {}
                }
                return getEmptyClient();
            });
            
            const [activeTab, setActiveTab] = useState('client');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            const [theme, setTheme] = useState(() => localStorage.getItem('immo_theme') || 'dark');
            
            // DVF State
            const [dvfLoading, setDvfLoading] = useState(false);
            const [dvfResult, setDvfResult] = useState("Saisissez l'adresse dans l'onglet Client pour comparer.");

            useEffect(() => {
                const handleHashChange = () => {
                    const hash = window.location.hash.replace('#', '');
                    if (hash === 'list') setView('list');
                    else if (hash === 'calendar') setView('calendar');
                    else if (hash === 'form') setView('form');
                    else setView('home');
                };
                window.addEventListener('hashchange', handleHashChange);
                if (view === 'form' && window.location.hash !== '#form') {
                    window.history.replaceState(null, null, '#form');
                }
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [view]);

            const navigate = (newView) => {
                window.location.hash = newView === 'home' ? '' : newView;
                setView(newView);
                setIsMenuOpen(false);
            };

            useEffect(() => {
                const root = window.document.documentElement;
                if (theme === 'dark') {
                    root.classList.add('dark');
                } else {
                    root.classList.remove('dark');
                }
                localStorage.setItem('immo_theme', theme);
            }, [theme]);

            const showNotification = (msg, type = 'success') => {
                setToast({ show: true, message: msg, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
            };

            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);

            const handleTouchStart = (e) => { setTouchEnd(null); setTouchStart(e.targetTouches[0].clientX); };
            const handleTouchMove = (e) => { setTouchEnd(e.targetTouches[0].clientX); };
            const handleTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const currentIndex = TABS.indexOf(activeTab);
                if (distance > 50 && currentIndex < TABS.length - 1) setActiveTab(TABS[currentIndex + 1]);
                if (distance < -50 && currentIndex > 0) setActiveTab(TABS[currentIndex - 1]);
                setTouchStart(null); setTouchEnd(null);
            };

            useEffect(() => {
                if (view === 'form') localStorage.setItem('immo_draft', JSON.stringify(currentClient));
            }, [currentClient, view]);

            // DÉPLOIEMENT DES ICÔNES AVEC SÉCURITÉ
            useEffect(() => {
                setTimeout(() => lucide.createIcons(), 50);
            }, [view, activeTab, currentClient?.medias, isMenuOpen, theme, toast.show, dvfResult, dvfLoading]);

            const handleSave = () => {
                if (!currentClient.nom && !currentClient.prenom) {
                    showNotification('Nom ou prénom obligatoire.', 'error');
                    return;
                }
                let updatedClients = [...clients];
                const existingIndex = clients.findIndex(c => c.id === currentClient.id);
                if (existingIndex >= 0) updatedClients[existingIndex] = currentClient;
                else updatedClients = [currentClient, ...clients];

                try {
                    localStorage.setItem('immo_clients', JSON.stringify(updatedClients));
                    setClients(updatedClients);
                    localStorage.removeItem('immo_draft');
                    setCurrentClient(getEmptyClient());
                    navigate('list');
                    showNotification('Dossier sauvegardé.');
                } catch (e) {
                    showNotification('Mémoire pleine. Nettoyez vos archives.', 'error');
                }
            };

            const abandonDraft = () => {
                if(window.confirm("Annuler cette estimation en cours ?")) {
                    localStorage.removeItem('immo_draft');
                    setCurrentClient(getEmptyClient());
                    navigate('home');
                }
            };

            const toggleTheme = () => {
                setTheme(theme === 'dark' ? 'light' : 'dark');
                setIsMenuOpen(false);
            };

            const triggerCamera = () => document.getElementById('camera-input').click();
            const triggerGallery = () => document.getElementById('gallery-input').click();

            const handleMediaUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                Promise.all(files.map(file => {
                    return new Promise((resolve) => {
                        if (file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                const img = new Image();
                                img.onload = () => {
                                    const canvas = document.createElement('canvas');
                                    const scale = 800 / img.width;
                                    canvas.width = 800; canvas.height = img.height * scale;
                                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                                    resolve({ type: 'image/jpeg', url: canvas.toDataURL('image/jpeg', 0.7) });
                                };
                                img.src = event.target.result;
                            };
                            reader.readAsDataURL(file);
                        } else {
                            const reader = new FileReader();
                            reader.onload = (ev) => resolve({ type: file.type, url: ev.target.result });
                            reader.readAsDataURL(file);
                        }
                    });
                })).then(newMedias => setCurrentClient(prev => ({ ...prev, medias: [...(prev.medias || []), ...newMedias] })));
                e.target.value = '';
            };

            const runDvfSearch = async () => {
                const address = currentClient?.adresse;
                const type = currentClient?.typeBien === 'Maison' ? 'Maison' : 'Appartement';

                if(!address) {
                    showNotification("Veuillez saisir une adresse dans l'onglet Client.", "error");
                    return;
                }

                setDvfLoading(true);
                setDvfResult("Recherche DVF dans un rayon de 300m...");

                try {
                    const addrRes = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(address)}&limit=1`);
                    const addrData = await addrRes.json();

                    if (!addrData.features || addrData.features.length === 0) {
                        setDvfResult("Adresse introuvable. Veuillez vérifier votre saisie.");
                        setDvfLoading(false);
                        return;
                    }

                    const [lon, lat] = addrData.features[0].geometry.coordinates;
                    const dvfRes = await fetch(`https://api.cquest.org/dvf?lat=${lat}&lon=${lon}&dist=300`);
                    const dvfData = await dvfRes.json();

                    if (!dvfData.resultats || dvfData.resultats.length === 0) {
                        setDvfResult("Aucune vente récente trouvée à moins de 300m.");
                        setDvfLoading(false);
                        return;
                    }

                    const ventes = dvfData.resultats.filter(v => 
                        v.type_local === type && 
                        v.valeur_fonciere > 0 && 
                        v.surface_reelle_bati > 0 
                    );

                    if (ventes.length === 0) {
                        setDvfResult(`Aucune vente de ${type} trouvée dans ce rayon.`);
                        setDvfLoading(false);
                        return;
                    }

                    const prixAuM2 = ventes.map(v => Math.round(v.valeur_fonciere / v.surface_reelle_bati))
                                           .filter(prix => prix > 500 && prix < 30000) 
                                           .sort((a, b) => a - b);

                    if (prixAuM2.length === 0) {
                        setDvfResult("Données inexploitables pour cette adresse.");
                        setDvfLoading(false);
                        return;
                    }

                    const minPrice = prixAuM2[0];
                    const maxPrice = prixAuM2[prixAuM2.length - 1];
                    setDvfResult(`Fourchette constatée (${type}) : ${minPrice} €/m² à ${maxPrice} €/m² (${ventes.length} ventes récentes)`);
                } catch (error) {
                    setDvfResult("Erreur réseau avec la base de données de l'État.");
                }
                setDvfLoading(false);
            };

            const calculPrixM2 = useMemo(() => {
                const surface = parseFloat(currentClient?.surfaceHabitable) || parseFloat(currentClient?.surfaceCarrez) || 0;
                const prix = parseFloat(currentClient?.projet?.prixAttendu) || 0;
                if (surface > 0 && prix > 0) return Math.round(prix / surface) + " €/m²";
                return "0 €/m²";
            }, [currentClient?.surfaceHabitable, currentClient?.surfaceCarrez, currentClient?.projet?.prixAttendu]);

            const tabIndex = TABS.indexOf(activeTab);
            const glassCard = "bg-white/60 dark:bg-white/[0.03] border border-stone-200/70 dark:border-white/[0.07] backdrop-blur-2xl";

            // TRI SÉCURISÉ DES DATES POUR L'AGENDA
            const rdvs = clients.filter(c => c && c.rdv).sort((a, b) => {
                const timeA = new Date(a.rdv).getTime();
                const timeB = new Date(b.rdv).getTime();
                return (isNaN(timeA) ? 0 : timeA) - (isNaN(timeB) ? 0 : timeB);
            });

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto relative">
                    
                    {toast.show && (
                        <div role="status" aria-live="polite" className="fixed top-4 inset-x-0 z-[60] max-w-md mx-auto px-4">
                            <div className={`toast-enter flex items-center gap-3 px-4 py-3.5 rounded-2xl border backdrop-blur-2xl shadow-2xl shadow-black/20 ${toast.type === 'error' ? 'bg-red-500/90 border-red-400/40 text-white' : 'bg-stone-900/90 dark:bg-white/10 border-white/10 text-white'}`}>
                                <div className={`flex items-center justify-center w-8 h-8 rounded-full ${toast.type === 'error' ? 'bg-white/20' : 'bg-accent/20 text-accent'}`}>
                                    <span key={toast.type}><i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-4 h-4"></i></span>
                                </div>
                                <span className="font-medium text-sm">{toast.message}</span>
                            </div>
                        </div>
                    )}

                    <header className="sticky top-0 z-40 px-4 pt-3 pb-2">
                        <div className={`flex justify-between items-center h-14 pl-4 pr-2 rounded-2xl ${glassCard} shadow-lg shadow-stone-900/[0.03] dark:shadow-black/40`}>
                            <button type="button" className="flex items-center gap-2.5" onClick={() => navigate('home')}>
                                <span className="flex items-center justify-center w-8 h-8 rounded-xl bg-stone-900 dark:bg-white text-accent dark:text-ink-900">
                                    <i data-lucide="building-2" className="w-4 h-4"></i>
                                </span>
                                <span className="font-semibold text-[17px] tracking-tight">Estimo</span>
                            </button>
                            
                            <div className="relative">
                                <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="flex items-center justify-center w-10 h-10 rounded-xl text-stone-600 dark:text-stone-300 hover:bg-stone-900/5 dark:hover:bg-white/[0.06] transition-colors">
                                    <i data-lucide="menu" className="w-5 h-5"></i>
                                </button>

                                {isMenuOpen && (
                                    <>
                                        <div className="fixed inset-0 z-40 bg-black/10 dark:bg-black/40 backdrop-blur-[2px]" onClick={() => setIsMenuOpen(false)}></div>
                                        <div className="toast-enter absolute right-0 mt-3 w-56 p-1.5 rounded-2xl bg-white/85 dark:bg-ink-800/85 border border-stone-200/70 dark:border-white/[0.08] backdrop-blur-2xl shadow-2xl shadow-black/20 z-50">
                                            <button onClick={() => navigate('home')} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-stone-700 dark:text-stone-200 hover:bg-stone-900/5 dark:hover:bg-white/[0.06] transition-colors">
                                                <i data-lucide="home" className="w-4 h-4 text-stone-400"></i> Accueil
                                            </button>
                                            <button onClick={() => navigate('calendar')} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-stone-700 dark:text-stone-200 hover:bg-stone-900/5 dark:hover:bg-white/[0.06] transition-colors">
                                                <i data-lucide="calendar" className="w-4 h-4 text-stone-400"></i> Agenda
                                            </button>
                                            <div className="h-px my-1 mx-2 bg-stone-200/80 dark:bg-white/[0.06]"></div>
                                            <button onClick={toggleTheme} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-stone-700 dark:text-stone-200 hover:bg-stone-900/5 dark:hover:bg-white/[0.06] transition-colors">
                                                <span key={theme}><i data-lucide={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4 text-stone-400"></i></span> {theme === 'dark' ? 'Mode Clair' : 'Mode Sombre'}
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 px-4 pt-4 pb-8 overflow-x-hidden">
                        {view === 'home' && (
                            <div className="view-enter flex flex-col justify-between min-h-[78vh] pt-10">
                                <div className="flex flex-col items-start">
                                    <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-medium uppercase tracking-[0.18em] text-accent bg-accent/10 border border-accent/20">
                                        <span className="w-1.5 h-1.5 rounded-full bg-accent"></span>
                                        Évaluation sur site
                                    </span>
                                    <h1 className="mt-6 text-5xl font-semibold tracking-[-0.04em] leading-[0.95] text-stone-900 dark:text-white text-balance">
                                        L&apos;estimation,<br /><span className="text-stone-400 dark:text-stone-500">sans compromis.</span>
                                    </h1>
                                </div>

                                <div className="flex flex-col w-full gap-3 mt-12">
                                    <button onClick={() => { localStorage.removeItem('immo_draft'); setCurrentClient(getEmptyClient()); setActiveTab('client'); navigate('form'); }}
                                            className="group w-full flex items-center gap-4 p-4 rounded-3xl bg-stone-900 dark:bg-white text-white dark:text-ink-900 shadow-2xl shadow-stone-900/20 dark:shadow-white/5 active:scale-[0.98] transition-transform">
                                        <span className="flex items-center justify-center w-12 h-12 rounded-2xl bg-accent text-ink-900">
                                            <i data-lucide="plus" className="w-5 h-5"></i>
                                        </span>
                                        <span className="flex flex-col items-start">
                                            <span className="font-semibold text-[16px] tracking-tight">Nouveau Dossier</span>
                                        </span>
                                        <i data-lucide="arrow-right" className="w-5 h-5 ml-auto opacity-60"></i>
                                    </button>

                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => navigate('list')}
                                                className={`flex flex-col items-start gap-6 p-4 rounded-3xl ${glassCard} text-stone-800 dark:text-stone-100 active:scale-[0.98] transition-transform`}>
                                            <span className="flex items-center justify-between w-full">
                                                <i data-lucide="folder-open" className="w-5 h-5 text-stone-500"></i>
                                                <span className="text-2xl font-semibold tabular-nums tracking-tight">{clients.length}</span>
                                            </span>
                                            <span className="font-medium text-sm">Archives</span>
                                        </button>
                                        <button onClick={() => navigate('calendar')}
                                                className={`flex flex-col items-start gap-6 p-4 rounded-3xl ${glassCard} text-stone-800 dark:text-stone-100 active:scale-[0.98] transition-transform`}>
                                            <span className="flex items-center justify-between w-full">
                                                <i data-lucide="calendar" className="w-5 h-5 text-stone-500"></i>
                                                <span className="text-2xl font-semibold tabular-nums tracking-tight">{rdvs.length}</span>
                                            </span>
                                            <span className="font-medium text-sm">Agenda</span>
                                        </button>
                                    </div>
                                    <a href="https://app.dvf.etalab.gouv.fr/" target="_blank" rel="noopener noreferrer"
                                            className={`flex flex-col items-center justify-center gap-2 p-3 mt-1 w-full rounded-2xl ${glassCard} text-stone-500 dark:text-stone-400 active:scale-[0.98] transition-transform`}>
                                        <span className="flex items-center gap-2 font-medium text-sm"><i data-lucide="map" className="w-4 h-4"></i> Accéder à la Base DVF Officielle <i data-lucide="arrow-up-right" className="w-3 h-3"></i></span>
                                    </a>
                                </div>
                            </div>
                        )}

                        {view === 'calendar' && (
                            <div className="view-enter">
                                <div className="flex items-end justify-between mb-6 mt-2">
                                    <div>
                                        <h1 className="text-3xl font-semibold tracking-tight text-stone-900 dark:text-white">Agenda</h1>
                                    </div>
                                    <span className="text-sm tabular-nums text-stone-500">{rdvs.length} rendez-vous</span>
                                </div>
                                <div className="space-y-3">
                                    {rdvs.length === 0 && (
                                        <p className="text-center text-stone-500 mt-10 text-sm">Aucun rendez-vous planifié.</p>
                                    )}
                                    {rdvs.map(c => (
                                        <div key={c.id} onClick={() => { setCurrentClient(c); setActiveTab('client'); navigate('form'); }} 
                                             className={`p-4 rounded-3xl ${glassCard} cursor-pointer transition-all hover:border-accent/40 active:scale-[0.99]`}>
                                            <div className="flex items-start gap-3">
                                                <div className="flex items-center justify-center shrink-0 w-11 h-11 rounded-2xl bg-gradient-to-br from-accent/30 to-accent/5 border border-accent/20 text-accent">
                                                    <i data-lucide="calendar-clock" className="w-5 h-5"></i>
                                                </div>
                                                <div className="min-w-0 flex-1">
                                                    <div className="flex items-center justify-between gap-2">
                                                        <h3 className="font-semibold tracking-tight text-stone-900 dark:text-white truncate">{c?.nom} {c?.prenom}</h3>
                                                    </div>
                                                    <p className="text-[13px] font-medium text-accent mt-0.5 capitalize">
                                                        {formatRdvDate(c.rdv)}
                                                    </p>
                                                    <p className="text-[11px] text-stone-400 mt-1 truncate">{c?.adresse || 'Pas d\'adresse'}</p>
                                                </div>
                                                <i data-lucide="chevron-right" className="w-4 h-4 text-stone-400 mt-1"></i>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'list' && (
                            <div className="view-enter">
                                <div className="flex items-end justify-between mb-6 mt-2">
                                    <div>
                                        <h1 className="text-3xl font-semibold tracking-tight text-stone-900 dark:text-white">Archives</h1>
                                    </div>
                                    <span className="text-sm tabular-nums text-stone-500">{clients.length} dossier{clients.length > 1 ? 's' : ''}</span>
                                </div>
                                <div className="space-y-3">
                                    {clients.length === 0 && <p className="text-center text-stone-500 mt-10 text-sm">Vos dossiers terminés apparaîtront ici.</p>}
                                    {clients.map(c => (
                                        <div key={c.id} onClick={() => { setCurrentClient(c); setActiveTab('client'); navigate('form'); }} 
                                             className={`p-4 rounded-3xl ${glassCard} cursor-pointer transition-all hover:border-accent/40 active:scale-[0.99]`}>
                                            <div className="flex items-start gap-3">
                                                <div className="flex items-center justify-center shrink-0 w-11 h-11 rounded-2xl bg-gradient-to-br from-accent/30 to-accent/5 border border-accent/20 text-accent font-semibold text-sm uppercase">
                                                    {((c?.prenom || '')[0] || '') + ((c?.nom || '')[0] || '') || '—'}
                                                </div>
                                                <div className="min-w-0 flex-1">
                                                    <div className="flex items-center gap-2">
                                                        <h3 className="font-semibold tracking-tight text-stone-900 dark:text-white truncate">{c?.nom} {c?.prenom}</h3>
                                                    </div>
                                                    <p className="text-[11px] text-stone-400 mt-0.5 tabular-nums">{c?.date}</p>
                                                </div>
                                                <i data-lucide="chevron-right" className="w-4 h-4 text-stone-400 mt-1"></i>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'form' && (
                            <div className="view-enter pb-28" onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}>
                                <div className="flex items-center justify-between mb-3 px-1">
                                    <p className="text-[11px] font-medium uppercase tracking-[0.18em] text-stone-500">Étape {tabIndex + 1} / {TABS.length}</p>
                                </div>
                                <div className="h-0.5 w-full rounded-full bg-stone-200 dark:bg-white/[0.06] mb-4 overflow-hidden">
                                    <div className="h-full bg-accent rounded-full transition-all duration-500 ease-out" style={{ width: `${((tabIndex + 1) / TABS.length) * 100}%` }}></div>
                                </div>

                                <div role="tablist" className={`flex overflow-x-auto gap-1 p-1 rounded-2xl ${glassCard} no-scrollbar mb-6`}>
                                    {TABS.map(tab => (
                                        <button key={tab} role="tab" aria-selected={activeTab === tab} onClick={() => setActiveTab(tab)}
                                            className={`flex-1 shrink-0 px-3 h-9 rounded-xl text-xs font-medium whitespace-nowrap transition-all duration-300 ${activeTab === tab ? 'bg-stone-900 dark:bg-white text-white dark:text-ink-900 shadow-md' : 'text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-white'}`}>
                                            {TAB_LABELS[tab]}
                                        </button>
                                    ))}
                                </div>

                                <div className={`tab-content p-5 rounded-3xl ${glassCard}`} key={activeTab}>
                                    {activeTab === 'client' && (
                                        <>
                                            <SectionTitle icon="user" title="Client" subtitle="Coordonnées et type de bien" />
                                            <label className="flex flex-col mb-4 group">
                                                <span className="text-[11px] font-medium uppercase tracking-[0.14em] text-stone-500 mb-2 ml-0.5 group-focus-within:text-accent transition-colors">Type de bien</span>
                                                <div className="relative">
                                                    <select value={currentClient?.typeBien || 'Appartement'} onChange={e => setCurrentClient({...currentClient, typeBien: e.target.value})} className="appearance-none w-full h-12 pl-4 pr-10 rounded-2xl text-[15px] bg-white/70 dark:bg-white/[0.04] border border-stone-200/80 dark:border-white/[0.08] text-stone-900 dark:text-stone-100 outline-none transition-all focus:border-accent/70 focus:ring-4 focus:ring-accent/15 dark:[&>option]:bg-ink-800">
                                                        <option>Appartement</option><option>Maison</option><option>Box / Garage</option><option>Terrain</option><option>Commerce / Bureau</option><option>Immeuble</option>
                                                    </select>
                                                </div>
                                            </label>
                                            <div className="grid grid-cols-2 gap-3">
                                                <Field label="Nom" value={currentClient?.nom} onChange={e => setCurrentClient({...currentClient, nom: e.target.value})} />
                                                <Field label="Prénom" value={currentClient?.prenom} onChange={e => setCurrentClient({...currentClient, prenom: e.target.value})} />
                                            </div>
                                            <Field label="Téléphone" type="tel" value={currentClient?.telephone} onChange={e => setCurrentClient({...currentClient, telephone: e.target.value})} />
                                            <Field label="Email" type="email" value={currentClient?.email} onChange={e => setCurrentClient({...currentClient, email: e.target.value})} />
                                            <Field label="Adresse du bien" value={currentClient?.adresse} onChange={e => setCurrentClient({...currentClient, adresse: e.target.value})} />
                                            <Field label="Prochain rendez-vous" type="datetime-local" value={currentClient?.rdv} onChange={e => setCurrentClient({...currentClient, rdv: e.target.value})} />
                                        </>
                                    )}

                                    {activeTab === 'bien' && (
                                        <>
                                            <SectionTitle icon="ruler" title="Le bien" subtitle="Surfaces et distribution" />
                                            <div className="grid grid-cols-2 gap-3">
                                                <Field label="Habitable (m²)" type="number" value={currentClient?.surfaceHabitable} onChange={e => setCurrentClient({...currentClient, surfaceHabitable: e.target.value})} />
                                                <Field label="Carrez (m²)" type="number" value={currentClient?.surfaceCarrez} onChange={e => setCurrentClient({...currentClient, surfaceCarrez: e.target.value})} />
                                            </div>
                                            <div className="grid grid-cols-3 gap-3">
                                                <Field label="Pièces" type="number" value={currentClient?.distribution?.pieces} onChange={e => setCurrentClient({...currentClient, distribution: {...currentClient.distribution, pieces: e.target.value}})} />
                                                <Field label="Chambres" type="number" value={currentClient?.distribution?.chambres} onChange={e => setCurrentClient({...currentClient, distribution: {...currentClient.distribution, chambres: e.target.value}})} />
                                            </div>
                                            <Field label="Terrasse / Balcon (m²)" value={currentClient?.annexes?.terrasse} onChange={e => setCurrentClient({...currentClient, annexes: {...currentClient.annexes, terrasse: e.target.value}})} />
                                        </>
                                    )}

                                    {activeTab === 'technique' && (
                                        <>
                                            <SectionTitle icon="wrench" title="Technique" subtitle="Équipements et état général" />
                                            <label className="flex flex-col mb-4 group">
                                                <span className="text-[11px] font-medium uppercase tracking-[0.14em] text-stone-500 mb-2 ml-0.5 group-focus-within:text-accent transition-colors">Chauffage</span>
                                                <div className="relative">
                                                    <select value={currentClient?.chauffage?.type || ''} onChange={e => setCurrentClient({...currentClient, chauffage: {...currentClient.chauffage, type: e.target.value}})} className="appearance-none w-full h-12 pl-4 pr-10 rounded-2xl text-[15px] bg-white/70 dark:bg-white/[0.04] border border-stone-200/80 dark:border-white/[0.08] text-stone-900 dark:text-stone-100 outline-none transition-all focus:border-accent/70 focus:ring-4 focus:ring-accent/15 dark:[&>option]:bg-ink-800">
                                                        <option value="">Sélectionnez...</option>
                                                        <option value="Individuel">Individuel</option>
                                                        <option value="Collectif">Collectif</option>
                                                    </select>
                                                </div>
                                            </label>
                                            <div className="mb-4">
                                                <span className="block text-[11px] font-medium uppercase tracking-[0.14em] text-stone-500 mb-2 ml-0.5">Équipements</span>
                                                <div className="rounded-2xl border border-stone-200/80 dark:border-white/[0.08] bg-white/50 dark:bg-white/[0.02] divide-y divide-stone-200/70 dark:divide-white/[0.06]">
                                                    <label className="flex items-center justify-between px-4 h-14 cursor-pointer">
                                                        <span className="flex items-center gap-3 text-[15px]"><i data-lucide="chef-hat" className="w-4 h-4 text-stone-400"></i>Cuisine équipée</span>
                                                        <input type="checkbox" className="peer sr-only" checked={currentClient?.equipements?.cuisineEquipee || false} onChange={e => setCurrentClient({...currentClient, equipements: {...currentClient.equipements, cuisineEquipee: e.target.checked}})} />
                                                        <span className="relative w-11 h-6 rounded-full bg-stone-300 dark:bg-white/10 peer-checked:bg-accent after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:rounded-full after:bg-white peer-checked:after:translate-x-5 transition-all"></span>
                                                    </label>
                                                    <label className="flex items-center justify-between px-4 h-14 cursor-pointer">
                                                        <span className="flex items-center gap-3 text-[15px]"><i data-lucide="car" className="w-4 h-4 text-stone-400"></i>Stationnement</span>
                                                        <input type="checkbox" className="peer sr-only" checked={currentClient?.equipements?.stationnement || false} onChange={e => setCurrentClient({...currentClient, equipements: {...currentClient.equipements, stationnement: e.target.checked}})} />
                                                        <span className="relative w-11 h-6 rounded-full bg-stone-300 dark:bg-white/10 peer-checked:bg-accent after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:rounded-full after:bg-white peer-checked:after:translate-x-5 transition-all"></span>
                                                    </label>
                                                    <label className="flex items-center justify-between px-4 h-14 cursor-pointer">
                                                        <span className="flex items-center gap-3 text-[15px]"><i data-lucide="wind" className="w-4 h-4 text-stone-400"></i>Climatisation</span>
                                                        <input type="checkbox" className="peer sr-only" checked={currentClient?.equipements?.climatisation || false} onChange={e => setCurrentClient({...currentClient, equipements: {...currentClient.equipements, climatisation: e.target.checked}})} />
                                                        <span className="relative w-11 h-6 rounded-full bg-stone-300 dark:bg-white/10 peer-checked:bg-accent after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:rounded-full after:bg-white peer-checked:after:translate-x-5 transition-all"></span>
                                                    </label>
                                                </div>
                                            </div>
                                        </>
                                    )}

                                    {activeTab === 'financier' && (
                                        <>
                                            <SectionTitle icon="wallet" title="Financier" subtitle="Charges, prix et DVF" />
                                            
                                            <div className="mb-5 p-4 rounded-2xl border border-stone-200/80 dark:border-white/[0.08] bg-white/50 dark:bg-white/[0.02]">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-[11px] font-medium uppercase tracking-[0.14em] text-accent">Comparateur DVF (300m)</span>
                                                    <button onClick={runDvfSearch} disabled={dvfLoading} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-accent text-ink-900 active:scale-95 transition-transform flex items-center gap-2">
                                                        <span key={dvfLoading ? 'loading' : 'search'}>
                                                            <i data-lucide={dvfLoading ? "loader-2" : "search"} className={`w-3.5 h-3.5 ${dvfLoading ? 'animate-spin' : ''}`}></i>
                                                        </span>
                                                        Calculer
                                                    </button>
                                                </div>
                                                <p className="text-sm text-stone-600 dark:text-stone-300 italic">{dvfResult}</p>
                                            </div>

                                            <div className="grid grid-cols-2 gap-3 mb-4">
                                                <Field label="Taxe foncière (€)" type="number" value={currentClient?.charges?.fonciere || ''} onChange={e => setCurrentClient({...currentClient, charges: {...currentClient.charges, fonciere: e.target.value}})} />
                                                <Field label="Copro (€/mois)" type="number" value={currentClient?.charges?.copro || ''} onChange={e => setCurrentClient({...currentClient, charges: {...currentClient.charges, copro: e.target.value}})} />
                                            </div>
                                            
                                            <label className="flex flex-col mb-4 w-full group">
                                                <span className="text-[11px] font-medium uppercase tracking-[0.14em] text-stone-500 dark:text-stone-500 mb-2 ml-0.5 transition-colors group-focus-within:text-accent">Délai de vente estimé</span>
                                                <select value={currentClient?.projet?.delai || 'Moyen'} onChange={e => setCurrentClient({...currentClient, projet: {...currentClient.projet, delai: e.target.value}})} 
                                                    className={`appearance-none w-full h-12 px-4 rounded-2xl text-[15px] font-medium border outline-none transition-all focus:ring-4 focus:ring-accent/15
                                                    ${(currentClient?.projet?.delai || '') === 'Court' ? 'bg-green-500/10 border-green-500/30 text-green-700 dark:text-green-400' : 
                                                      (currentClient?.projet?.delai || '') === 'Moyen' ? 'bg-orange-500/10 border-orange-500/30 text-orange-700 dark:text-orange-400' : 
                                                      'bg-red-500/10 border-red-500/30 text-red-700 dark:text-red-400'}`}>
                                                    <option value="Court" className="text-stone-900 dark:text-stone-100">Court (Vente rapide)</option>
                                                    <option value="Moyen" className="text-stone-900 dark:text-stone-100">Moyen (Délai standard)</option>
                                                    <option value="Long" className="text-stone-900 dark:text-stone-100">Long (Bien atypique / patient)</option>
                                                </select>
                                            </label>

                                            <div className="grid grid-cols-2 gap-3">
                                                <Field label="Prix attendu (€)" type="number" value={currentClient?.projet?.prixAttendu || ''} onChange={e => setCurrentClient({...currentClient, projet: {...currentClient.projet, prixAttendu: e.target.value}})} />
                                                <Field label="Prix / m²" type="text" value={calculPrixM2} readOnly={true} />
                                            </div>
                                        </>
                                    )}

                                    {activeTab === 'medias' && (
                                        <div>
                                            <SectionTitle icon="images" title="Médias" subtitle={`${(currentClient?.medias || []).length} photo${(currentClient?.medias || []).length > 1 ? 's' : ''} jointe${(currentClient?.medias || []).length > 1 ? 's' : ''}`} />
                                            <input id="camera-input" type="file" accept="image/jpeg, image/png, image/jpg" capture="camera" onChange={handleMediaUpload} className="hidden" />
                                            <input id="gallery-input" type="file" accept="image/*" multiple onChange={handleMediaUpload} className="hidden" />
                                            <div className="grid grid-cols-2 gap-3 mb-4">
                                                <button onClick={triggerCamera} type="button" className="flex flex-col items-center justify-center gap-2 h-28 rounded-2xl bg-stone-900 dark:bg-white text-white dark:text-ink-900 active:scale-[0.98] transition-transform">
                                                    <span className="flex items-center justify-center w-10 h-10 rounded-full bg-accent text-ink-900">
                                                        <i data-lucide="camera" className="w-5 h-5"></i>
                                                    </span>
                                                    <span className="text-xs font-medium">Photo</span>
                                                </button>
                                                <button onClick={triggerGallery} type="button" className="flex flex-col items-center justify-center gap-2 h-28 rounded-2xl border border-dashed border-stone-300 dark:border-white/15 bg-white/40 dark:bg-white/[0.02] text-stone-600 dark:text-stone-300 active:scale-[0.98] transition-transform">
                                                    <span className="flex items-center justify-center w-10 h-10 rounded-full bg-stone-900/5 dark:bg-white/[0.06]">
                                                        <i data-lucide="image" className="w-5 h-5"></i>
                                                    </span>
                                                    <span className="text-xs font-medium">Galerie</span>
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="fixed bottom-0 inset-x-0 z-30 max-w-md mx-auto px-4 pb-4 pt-3">
                                    <div className={`flex gap-2 p-2 rounded-3xl border border-stone-200/70 dark:border-white/[0.07] backdrop-blur-2xl bg-white/80 dark:bg-ink-800/70 shadow-2xl shadow-black/10 dark:shadow-black/50`}>
                                        <button onClick={abandonDraft} className="flex-1 h-12 rounded-2xl text-sm font-medium text-stone-500 dark:text-stone-400 hover:bg-stone-900/5 dark:hover:bg-white/[0.06] transition-colors">
                                            Annuler
                                        </button>
                                        <button onClick={handleSave} className="flex-[2] h-12 rounded-2xl bg-accent text-ink-900 text-sm font-semibold flex items-center justify-center gap-2 shadow-lg shadow-accent/25 active:scale-[0.98] transition-transform">
                                            <i data-lucide="check" className="w-4 h-4"></i><span>Enregistrer</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
