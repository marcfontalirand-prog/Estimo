<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,useCallback}=React;
const STORE='estimo.v2.dossiers', THEME='estimo.v2.theme';
const TYPES=['Appartement','Maison','Terrain','Immeuble','Local commercial','Parking / Box','Autre'];
const TABS=[['client','Client'],['bien','Bien'],['technique','Technique'],['financier','Financier'],['location','Location'],['medias','Médias']];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const n=(v)=>{const x=parseFloat(String(v??'').replace(',','.').replace(/\s/g,''));return isFinite(x)?x:null};
const eur=(v)=>v==null?'—':Math.round(v).toLocaleString('fr-FR')+' €';
const pct=(x)=>x==null?'—':(x*100).toFixed(2).replace('.',',')+' %';
const ajPct=(x)=>x==null?'—':(x>=0?'+':'')+(x*100).toFixed(1).replace('.',',')+' %';
const fmtDate=(t)=>new Date(t).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
const blank=()=>({id:uid(),created:Date.now(),updated:Date.now(),
 client:{type:'Appartement',nom:'',prenom:'',tel:'',email:'',adresse:''},
 bien:{carrez:'',habitable:'',terrain:'',jardin:'',balcon:'',terrasse:'',cave:'',pieces:'',chambres:'',sdb:'',hsp:'',etage:'',ascenseur:false,exposition:'',visavis:'',bruit:'',vue:''},
 technique:{chauffage:'',energie:'',isolation:'',menuiseries:'',dpe:'',annee:'',cuisine:false,parking:'',borneVE:false,climatisation:false,piscine:false,travaux:'',toiture:false,fissures:false,humidite:false,amiante:false,notesEtat:''},
 financier:{taxeFonciere:'',charges:'',motivation:'',delai:'',prixAttendu:'',notes:''},
 medias:[],dvf:null,loyer:null,ajust:{over:{},off:[],manuel:0}});
const load=()=>{try{return JSON.parse(localStorage.getItem(STORE))||[]}catch(e){return[]}};
const save=(l)=>{try{localStorage.setItem(STORE,JSON.stringify(l));return true}catch(e){alert('Stockage plein : supprimez des photos ou des dossiers.');return false}};
const backupName=()=>'estimo-dossiers-'+new Date().toISOString().slice(0,10)+'.json';
// Sauvegarde de tous les dossiers (photos comprises) dans un fichier JSON téléchargé.
const backup=(list)=>{const payload={app:'Estimo',format:'estimo.v2.backup',exportedAt:new Date().toISOString(),nb:list.length,dossiers:list};
 const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=backupName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
const readBackup=async(file)=>{const o=JSON.parse(await file.text());const arr=Array.isArray(o)?o:(o&&Array.isArray(o.dossiers)?o.dossiers:null);
 if(!arr)throw new Error('fichier non reconnu (sauvegarde Estimo attendue)');
 const ok=arr.filter(d=>d&&d.id&&d.client&&d.bien);if(!ok.length)throw new Error('aucun dossier valide dans le fichier');return ok};
// Fusion sans écrasement : un dossier existant n'est remplacé que par une version plus récente.
const mergeDossiers=(cur,inc,opts)=>{const keep=!!(opts&&opts.keepMedias);const m=new Map(cur.map(d=>[d.id,d]));let added=0,upd=0;for(const d of inc){const e=m.get(d.id);
 if(!e){m.set(d.id,d);added++}else if((+d.updated||0)>(+e.updated||0)){m.set(d.id,keep&&d._mediasStripped?{...d,medias:(e.medias||[]).slice(),_mediasStripped:undefined,_mediasCount:undefined}:d);upd++}}
 return{list:[...m.values()].sort((a,b)=>(b.updated||0)-(a.updated||0)),added,upd}};
const surfRef=(d)=>n(d.bien.carrez)||n(d.bien.habitable);
const dvfType=(t)=>t==='Appartement'?'appartement':t==='Maison'?'maison':null;

function Logo({size=40}){return(<svg width={size} height={size} viewBox="0 0 64 64" aria-label="Estimo"><rect width="64" height="64" rx="14" fill="#0b1f3a"/><path d="M12 31 32 14l20 17" fill="none" stroke="#fff" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/><path d="M18 28v22h28V28" fill="none" stroke="#fff" strokeWidth="4.5" strokeLinejoin="round"/><path d="M27.5 33.5a4.5 4.5 0 1 1 6.4 4.1c-1.3.6-1.9 1.4-1.9 2.8v1" fill="none" stroke="#7fb0ff" strokeWidth="3.6" strokeLinecap="round"/><circle cx="32" cy="46" r="2.2" fill="#7fb0ff"/></svg>)}

const Field=({label,children,hint})=>(<label className="block mb-3"><span className="block text-xs font-semibold uppercase tracking-wide text-navy-600 dark:text-navy-200 mb-1">{label}</span>{children}{hint&&<span className="block text-xs mt-1 opacity-70">{hint}</span>}</label>);
const Txt=({v,on,type='text',ph,mode})=>(<input className="inp" type={type} inputMode={mode} value={v??''} placeholder={ph} onChange={e=>on(e.target.value)}/>);
const Num=({v,on,ph,unit})=>(<div className="relative"><input className="inp pr-12" inputMode="decimal" value={v??''} placeholder={ph} onChange={e=>on(e.target.value)}/>{unit&&<span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm opacity-60">{unit}</span>}</div>);
const Sel=({v,on,opts})=>(<select className="inp" value={v} onChange={e=>on(e.target.value)}><option value="">— Choisir —</option>{opts.map(o=><option key={o}>{o}</option>)}</select>);
const Chk=({v,on,label})=>(<button type="button" onClick={()=>on(!v)} className={`glass glass-btn rounded-xl px-3 py-2 text-sm font-medium mr-2 mb-2 ${v?'!bg-navy-800 !text-white':''}`}>{v?'✓ ':''}{label}</button>);
const Card=({title,children})=>(<section className="glass rounded-2xl p-4 mb-4">{title&&<h3 className="font-bold text-navy-800 dark:text-white mb-3">{title}</h3>}{children}</section>);
const G2=({children})=>(<div className="grid grid-cols-2 gap-x-3">{children}</div>);
const Btn=({children,on,primary,cls=''})=>(<button type="button" onClick={on} className={`glass-btn rounded-xl px-4 py-2.5 font-semibold ${primary?'bg-navy-800 text-white shadow-lg':'glass'} ${cls}`}>{children}</button>);

async function compress(file,w=800){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const s=Math.min(1,w/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return{data:c.toDataURL('image/jpeg',0.72),w:c.width,h:c.height}}finally{URL.revokeObjectURL(url)}}

function fiche(d){const c=d.client,b=d.bien,t=d.technique,f=d.financier,S=surfRef(d),P=n(f.prixAttendu);const L=[];const add=(k,v)=>{if(v!==''&&v!=null&&v!==false)L.push(`• ${k} : ${v===true?'oui':v}`)};
L.push('FICHE D\u2019ESTIMATION — ESTIMO','Date : '+fmtDate(Date.now()),'');
L.push('CLIENT');add('Vendeur',[c.prenom,c.nom].filter(Boolean).join(' '));add('Téléphone',c.tel);add('Email',c.email);add('Adresse du bien',c.adresse);add('Type de bien',c.type);L.push('');
L.push('BIEN');add('Surface Carrez',b.carrez&&b.carrez+' m²');add('Surface habitable',b.habitable&&b.habitable+' m²');add('Terrain',b.terrain&&b.terrain+' m²');add('Jardin',b.jardin&&b.jardin+' m²');add('Balcon',b.balcon&&b.balcon+' m²');add('Terrasse',b.terrasse&&b.terrasse+' m²');add('Cave / annexes',b.cave&&b.cave+' m²');add('Pièces',b.pieces);add('Chambres',b.chambres);add('Salles d\u2019eau / de bains',b.sdb);add('Hauteur sous plafond',b.hsp&&b.hsp+' m');add('Étage',b.etage);add('Ascenseur',b.ascenseur);add('Exposition',b.exposition);add('Vis-à-vis',b.visavis);add('Bruit',b.bruit);add('Vue',b.vue);L.push('');
L.push('TECHNIQUE');add('Chauffage',[t.chauffage,t.energie].filter(Boolean).join(' — '));add('Isolation',t.isolation);add('Menuiseries',t.menuiseries);add('DPE',t.dpe);add('Année de construction',t.annee);add('Cuisine équipée',t.cuisine);add('Stationnement',t.parking);add('Borne de recharge VE',t.borneVE);add('Climatisation',t.climatisation);add('Piscine',t.piscine);add('Travaux réalisés',t.travaux);
const w=[t.toiture&&'toiture',t.fissures&&'fissures',t.humidite&&'humidité',t.amiante&&'amiante / plomb à diagnostiquer'].filter(Boolean);add('Points d\u2019attention',w.join(', '));add('Remarques état',t.notesEtat);L.push('');
L.push('FINANCIER');add('Taxe foncière',f.taxeFonciere&&eur(n(f.taxeFonciere))+' / an');add('Charges de copropriété',f.charges&&eur(n(f.charges))+' / an');add('Motivation de vente',f.motivation);add('Délai souhaité',f.delai);add('Prix attendu',P&&eur(P));if(P&&S)add('Prix attendu au m²',eur(P/S)+' /m²');L.push('');
if(d.dvf&&d.dvf.median){const v=d.dvf;L.push('MARCHÉ (DVF)');add('Source',v.source+(v.fallback?' (secours)':''));add('Comparables',`${v.n} ventes ${v.type}s dans un rayon de ${v.radius} m du ${v.since.split('-').reverse().join('/')} au ${v.lastSale?fmtDate(v.lastSale):'—'}`);add('Prix médian',eur(v.median)+' /m²');add('Fourchette interquartile',`${eur(v.q1)} – ${eur(v.q3)} /m²`);if(S){add('Valeur indicative (médiane × surface)',eur(v.median*S));}if(P&&S)add('Écart prix attendu / médiane DVF',((P/S/v.median-1)*100).toFixed(1).replace('.',',')+' %');L.push('');}
const A=computeAjust(d);if(A.ok){L.push('ESTIMATION AJUSTÉE');add('Médiane DVF',eur(A.median)+' /m²');if(A.rows.length)add('Ajustements retenus',A.rows.map(r=>r.label+' '+ajPct(r.pct)).join(' · '));if(A.manuel)add('Positionnement de l’agent',ajPct(A.manuel));add('Total ajustement',ajPct(A.total)+(A.cappedTotal?' (plafonné)':''));add('Prix au m² ajusté',eur(A.m2)+' /m²');add('Valeur estimée',eur(A.valeur)+(A.bas&&A.haut?' — fourchette '+eur(A.bas)+' à '+eur(A.haut):''));if(P&&A.valeur)add('Écart prix attendu / estimation ajustée',((P/A.valeur-1)*100).toFixed(1).replace('.',',')+' %');L.push('');}
if(d.loyer){const l=d.loyer;L.push('LOCATIF');add('Loyer estimé vide',eur(l.vide)+' / mois charges comprises (fourchette '+eur(l.bas)+' – '+eur(l.haut)+')');if(l.meuble)add('Loyer estimé meublé',eur(l.meuble)+' / mois (hypothèse +15 %)');add('Rendement brut',pct(l.rendementVide)+' vide'+(l.meuble?' · '+pct(l.rendementMeuble)+' meublé':'')+(l.prixVente?' sur '+eur(l.prixVente):''));add('Référence',`${l.m2.toLocaleString('fr-FR')} €/m² — ${l.indicateur}, ${l.commune}`);add('Encadrement des loyers',l.encadrement?'oui, commune soumise à l’encadrement':'non applicable');add('Source',`${l.source}, ${l.annee}`);L.push('');}
if(d.medias.length)L.push(`Photos jointes au dossier : ${d.medias.length}`);L.push('Estimation indicative, non contractuelle.');return L.join('\n')}

function vcard(c){const e=(s)=>String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');return['BEGIN:VCARD','VERSION:3.0',`N:${e(c.nom)};${e(c.prenom)};;;`,`FN:${e([c.prenom,c.nom].filter(Boolean).join(' ')||'Client Estimo')}`,c.tel&&`TEL;TYPE=CELL:${e(c.tel)}`,c.email&&`EMAIL;TYPE=INTERNET:${e(c.email)}`,c.adresse&&`ADR;TYPE=HOME:;;${e(c.adresse)};;;;France`,`NOTE:${e('Vendeur — '+c.type+' (Estimo)')}`,'END:VCARD'].filter(Boolean).join('\r\n')}
function download(name,text,mime){const b=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}


const safeName=(d)=>([d.client.prenom,d.client.nom].filter(Boolean).join('-')||'client').replace(/[^\p{L}\p{N}-]+/gu,'_');
function ficheImage(txt){const lines=[];const W=1080,pad=56,fs=26,lh=38;const c=document.createElement('canvas');const g=c.getContext('2d');g.font=`${fs}px sans-serif`;
for(const raw of txt.split('\n')){let cur='';for(const w of raw.split(' ')){const t=cur?cur+' '+w:w;if(g.measureText(t).width>W-2*pad&&cur){lines.push(cur);cur=w}else cur=t}lines.push(cur)}
c.width=W;c.height=pad*2+120+lines.length*lh;g.fillStyle='#fff';g.fillRect(0,0,W,c.height);g.fillStyle='#0b1f3a';g.fillRect(0,0,W,110);g.fillStyle='#fff';g.font='bold 44px sans-serif';g.fillText('Estimo — Fiche d’estimation',pad,72);
let y=110+pad;for(const l of lines){const head=/^[A-ZÉÈ’ ()]{4,}$/.test(l.trim());g.font=(head?'bold ':'')+`${fs}px sans-serif`;g.fillStyle=head?'#1d3f73':'#0b1f3a';g.fillText(l,pad,y);y+=lh}
return new Promise(r=>c.toBlob(b=>r(b),'image/png'))}
async function shareFiche(d,say){const txt=fiche(d);const title='Fiche d’estimation Estimo';
try{if(navigator.share){let files;try{const b=await ficheImage(txt);const f=new File([b],`fiche-${safeName(d)}.png`,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))files=[f]}catch(e){}
 try{await navigator.share(files?{title,text:txt,files}:{title,text:txt});return say('Fiche partagée ✓')}catch(e){if(e.name==='AbortError')return;if(files){await navigator.share({title,text:txt});return say('Fiche partagée ✓')}}}}catch(e){}
await copyText(txt);say('Partage indisponible : fiche copiée dans le presse-papier ✓')}
async function copyText(txt){try{await navigator.clipboard.writeText(txt)}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}}
async function shareContact(d,say){const name=safeName(d)+'.vcf',txt=vcard(d.client);const f=new File([txt],name,{type:'text/vcard'});
if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Contact '+name.replace('.vcf','')});return say('Contact partagé ✓')}catch(e){if(e.name==='AbortError')return}}
download(name,txt,'text/vcard;charset=utf-8');say('Fichier contact téléchargé : ouvrez-le pour l’ajouter au carnet ✓')}
const waLink=(d)=>{const tel=(d.client.tel||'').replace(/[^\d+]/g,'').replace(/^0(\d{9})$/,'33$1').replace(/^\+/,'');return `https://wa.me/${''}?text=${encodeURIComponent(fiche(d))}`};
const mailLink=(d)=>`mailto:${encodeURIComponent(d.client.email||'')}?subject=${encodeURIComponent('Estimation de votre bien'+(d.client.adresse?' — '+d.client.adresse:''))}&body=${encodeURIComponent(fiche(d))}`;
function ShareBar({d,compact}){const [msg,setMsg]=useState('');const say=(m)=>{setMsg(m);setTimeout(()=>setMsg(''),3500)};
const B=({on,href,icon,label,cls=''})=>{const c=`glass-btn flex-1 min-w-0 rounded-xl px-2 py-2 text-xs font-semibold flex flex-col items-center gap-0.5 ${cls}`;return href?<a href={href} target="_blank" rel="noopener" className={c}><span className="text-lg leading-none">{icon}</span>{label}</a>:<button type="button" onClick={on} className={c}><span className="text-lg leading-none">{icon}</span>{label}</button>};
return(<div data-testid="sharebar"><div className={`flex gap-1.5 ${compact?'':'glass rounded-2xl p-1.5'}`}>
<B on={()=>shareFiche(d,say)} icon="📄" label="Fiche" cls="bg-navy-800 text-white"/><B on={()=>shareContact(d,say)} icon="👤" label="Contact" cls="glass"/><B href={waLink(d)} icon="💬" label="WhatsApp" cls="glass !text-emerald-700 dark:!text-emerald-300"/><B href={mailLink(d)} icon="✉️" label="Email" cls="glass"/><B on={async()=>{await copyText(fiche(d));say('Fiche copiée ✓')}} icon="📋" label="Copier" cls="glass"/></div>
{msg&&<p className="text-xs mt-1 text-emerald-600 text-center">{msg}</p>}</div>)}

function Home({list,open,create,del,dark,setDark,parametres,snap}){const nb=list.length;
const used=useMemo(()=>Math.round(new Blob([JSON.stringify(list)]).size/1024),[list]);return(<div className="max-w-3xl mx-auto px-4 pb-24" style={{paddingTop:'max(env(safe-area-inset-top),1rem)'}}>
<header className="flex items-center justify-between mb-6"><div className="flex items-center gap-3"><Logo size={44}/><div><h1 className="text-2xl font-extrabold tracking-tight">Estimo</h1><p className="text-xs opacity-70">Estimation sur site · V2.5</p></div></div><div className="flex items-center gap-2"><button onClick={parametres} className="glass glass-btn rounded-full w-11 h-11 text-lg" aria-label="Paramètres">⚙️</button><button onClick={()=>setDark(!dark)} className="glass glass-btn rounded-full w-11 h-11 text-lg" aria-label="Mode sombre">{dark?'☀️':'🌙'}</button></div></header>
<div className="rounded-3xl p-5 mb-5 bg-gradient-to-br from-navy-800 to-navy-950 text-white shadow-xl"><p className="text-sm opacity-80">Dossiers enregistrés</p><p className="text-5xl font-extrabold my-1" data-testid="count">{nb}</p><p className="text-xs opacity-70">Stockés sur cet appareil (hors ligne)</p><button onClick={create} className="mt-4 w-full rounded-xl py-3 font-bold bg-white/15 backdrop-blur border border-white/30 glass-btn">＋ Nouvelle estimation</button>
<p className="text-[11px] opacity-70 mt-2" data-testid="storage">Sauvegarde automatique · {nb} dossier(s) · ~{used} Ko{snap?' · dernière copie '+new Date(snap.at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</p></div>
<h2 className="font-bold mb-3">Dossiers récents</h2>
{nb===0&&<p className="glass rounded-2xl p-5 text-sm opacity-80">Aucun dossier pour l’instant. Créez votre première estimation.</p>}
{[...list].sort((a,b)=>b.updated-a.updated).map(d=>{const S=surfRef(d),P=n(d.financier.prixAttendu);return(<div key={d.id} className="glass rounded-2xl p-4 mb-3"><div className="flex items-center gap-3">

function avisEtat(d){const A=computeAjust(d);const v=d.dvf;const ok=!!(A.ok&&v&&v.median&&v.n>0);
 const why=!A.surface?'surface du bien manquante':!v||!v.median?'comparatif DVF non lancé':!v.n?'aucune vente comparable':'';return{A,ok,why};}
function avisDoc(d,A){return EstimoPDF.buildAvis(d,{ajust:A,cutoff:EstimoDVF.DATA_CUTOFF,demo:true,appVersion:'Estimo '+(window.ESTIMO_VERSION||'2.5')});}
function openAvis(d,mode){const{A,ok,why}=avisEtat(d);
 if(!ok)return alert('Avis de valeur indisponible : '+why+'. Lancez le comparatif DVF ci-dessous.');
 const w=window.open('','_blank');
 if(!w)return alert('Fenêtre bloquée : autorisez les fenêtres surgissantes pour Estimo, ou utilisez « Télécharger le .html ».');
 let doc;try{doc=avisDoc(d,A)}catch(e){w.close();return alert('Avis de valeur impossible : '+e.message)}
 try{w.document.open();w.document.write(doc.html);w.document.close();w.document.title=doc.filename;}catch(e){return alert('Écriture impossible : '+e.message)}
 if(mode==='print'){const go=()=>{try{w.focus();w.print()}catch(e){}};
  if(w.document.readyState==='complete')setTimeout(go,600);else w.onload=()=>setTimeout(go,400);}
}
function saveAvis(d){const{A,ok,why}=avisEtat(d);if(!ok)return alert('Avis de valeur indisponible : '+why+'.');
 try{const doc=avisDoc(d,A);download(doc.filename+'.html',doc.html,'text/html;charset=utf-8');}catch(e){alert('Avis de valeur impossible : '+e.message)}}

 {ok?<div className="rounded-xl bg-navy-800 text-white p-3 mb-3" data-testid="avis-pret"><p className="text-[10px] uppercase opacity-80">Document prêt · 18 pages A4</p><p className="text-2xl font-extrabold">{eur(A.valeur)}</p><p className="text-xs opacity-85">fourchette {eur(A.bas)} – {eur(A.haut)} · {v.n} ventes à {v.radius} m · DVF arrêté au {fmtDate(EstimoDVF.DATA_CUTOFF)}</p></div>

<div key="m"><Card title="Photos du bien"><p className="text-xs opacity-75 mb-3">Compression automatique à 800 px de large (JPEG).</p><div className="flex gap-2 mb-3"><Btn primary on={()=>camRef.current.click()} cls="flex-1">📷 Prendre une photo</Btn><Btn on={()=>fileRef.current.click()} cls="flex-1">🖼 Galerie</Btn></div>
<input ref={camRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>{addPhotos([...e.target.files]);e.target.value=''}}/><input ref={fileRef} data-testid="gallery" type="file" accept="image/*" multiple className="hidden" onChange={e=>{addPhotos([...e.target.files]);e.target.value=''}}/>
{busy&&<p className="text-sm">Compression…</p>}{d.medias.length===0&&<p className="text-sm opacity-70">Aucune photo.</p>}
<div className="grid grid-cols-2 sm:grid-cols-3 gap-2">{d.medias.map(m=>(<div key={m.id} className="relative"><img src={m.data} className="rounded-xl w-full aspect-[4/3] object-cover"/><span className="absolute bottom-1 left-1 text-[10px] bg-black/50 text-white rounded px-1">{m.w}×{m.h}</span><button onClick={()=>update(x=>({...x,medias:x.medias.filter(y=>y.id!==m.id)}))} className="absolute top-1 right-1 glass rounded-full w-7 h-7 text-xs">✕</button></div>))}</div></Card></div>];
return(<div className="min-h-screen pb-28"><header className="sticky top-0 z-20 glass !rounded-none px-3 pb-2" style={{paddingTop:'max(env(safe-area-inset-top),.6rem)'}}><div className="max-w-3xl mx-auto"><div className="flex items-center gap-2 mb-2"><button onClick={back} className="glass glass-btn rounded-full w-10 h-10" aria-label="Accueil">‹</button><Logo size={30}/><div className="flex-1 min-w-0"><p className="font-bold truncate">{[c.prenom,c.nom].filter(Boolean).join(' ')||'Nouveau dossier'}</p><p className="text-xs opacity-70 truncate">{c.type}{S?` · ${S} m²`:''} · enregistré automatiquement</p></div></div>
<nav className="flex gap-1 overflow-x-auto mb-2">{TABS.map(([k,l],i)=>(<button key={k} onClick={()=>go(i)} className={`glass-btn flex-1 rounded-xl px-1 py-2 text-[11.5px] sm:text-sm font-semibold whitespace-nowrap ${tab===i?'bg-navy-800 text-white shadow':'glass'}`}>{l}</button>))}</nav><ShareBar d={d}/></div></header>
<div className="overflow-hidden" style={{touchAction:"pan-y"}} onTouchStart={ts} onTouchMove={tm} onTouchEnd={te}><div className="track" style={{transform:`translateX(calc(${-tab*100}% + ${drag}px))`,transition:drag?'none':undefined}}>{panes.map((p,i)=>(<div key={i} className="pane px-4 pt-4" style={i===tab?{}:{height:0,overflow:'hidden'}}><div className="max-w-3xl mx-auto">{p}</div></div>))}</div></div>
<div className="fixed bottom-0 inset-x-0 p-3 z-20" style={{paddingBottom:'max(env(safe-area-inset-bottom),.75rem)'}}><div className="max-w-3xl mx-auto flex gap-2"><Btn on={()=>go(tab-1)} cls={`flex-1 ${tab===0?'opacity-40':''}`}>‹ Précédent</Btn><Btn primary on={()=>tab===TABS.length-1?back():go(tab+1)} cls="flex-1">{tab===TABS.length-1?'Terminer ✓':'Suivant ›'}</Btn></div><p className="text-center text-[10px] opacity-50 mt-1">Glissez à gauche / à droite pour changer d’onglet</p></div></div>)}

const AJ_GROUPES=['Bien','Environnement','Technique','Points d’attention'];
// Panneau d'ajustement : rend visibles les coefficients appliqués à la médiane DVF.
function AjustPanel({d,update}){const A=computeAjust(d);const [edit,setEdit]=useState(false);
const patch=(fn)=>update(x=>({...x,ajust:{...(x.ajust||{}),...fn(x.ajust||{})}}));
const setOver=(id,v)=>patch(a=>{const o={...(a.over||{})};if(v==='')delete o[id];else o[id]=v;return{over:o}});
const setOff=(id,on)=>patch(a=>{const s=new Set(a.off||[]);if(on)s.add(id);else s.delete(id);return{off:[...s]}});
const setPct=(id,raw)=>{if(raw==='')return setOver(id,'');const v=Number(String(raw).replace(',','.'));if(!isFinite(v))return;setOver(id,String(v/100))};
const reset=()=>patch(()=>({over:{},off:[],manuel:0}));
if(!d.dvf||!d.dvf.median)return(<Card title="Estimation ajustée"><p className="text-sm opacity-80">Lancez d’abord le comparatif DVF ci-dessus : les ajustements portent sur la médiane du marché.</p></Card>);
return(<Card title="Estimation ajustée">
<div className="rounded-2xl bg-navy-800 text-white p-4 text-center" data-testid="ajust"><p className="text-xs uppercase opacity-80">Valeur estimée</p><p className="text-3xl font-extrabold">{A.valeur?eur(A.valeur):'—'}</p><p className="text-xs opacity-80">{A.m2?eur(A.m2)+' /m²':''}{A.surface?' · '+A.surface+' m²':''}</p>{A.bas&&A.haut?<p className="text-xs opacity-70 mt-1">Fourchette {eur(A.bas)} – {eur(A.haut)}</p>:null}<p className="text-xs mt-2">{A.total===0?'Aucun ajustement':ajPct(A.total)+' sur la médiane'} · médiane {eur(A.median)}/m²</p></div>
{A.delta?<p className="text-xs opacity-70 mt-2">Écart avec la médiane brute : {ajPct(A.ecartPct)} soit {A.delta>0?'+':''}{eur(A.delta)}</p>:null}
<p className="text-[11px] opacity-70 mt-3">La médiane DVF contient déjà l’état moyen des biens vendus : ces coefficients affinent un point de départ, ils ne le remplacent pas. Chaque ligne est plafonnée à ±8 %, le total à ±20 %.</p>
{A.manquants.length>0?<p className="text-xs text-amber-600 mt-2" data-testid="manquants">Pour affiner : {A.manquants.join(', ')} non renseigné(s).</p>:null}
<table className="w-full text-xs mt-3"><thead><tr className="text-left opacity-70"><th className="py-1">Ajustement</th><th className="text-right">Effet</th><th className="text-right">€/m²</th>{edit?<th/>:null}</tr></thead><tbody>
{AJ_GROUPES.map(g=>{const rows=A.rows.filter(r=>r.group===g);if(!rows.length)return null;return(<React.Fragment key={g}><tr><td colSpan={edit?4:3} className="pt-3 pb-1 text-[10px] uppercase font-bold opacity-60">{g}</td></tr>{rows.map(r=>(<tr key={r.id} className="border-t border-navy-100 dark:border-navy-800"><td className="py-1">{r.label}{r.custom?' ✎':''}{r.capped?' (plafonné)':''}</td><td className="text-right font-semibold">{ajPct(r.pct)}</td><td className="text-right">{A.median?eur(Math.round(A.median*r.pct)):'—'}</td>{edit?<td className="text-right"><button onClick={()=>setOff(r.id,true)} className="opacity-50 px-1" aria-label="Retirer">✕</button></td>:null}</tr>))}</React.Fragment>)})}
</tbody></table>
{edit?<div className="mt-3"><p className="text-[10px] uppercase font-bold opacity-60 mb-1">Coefficients en % (vide = barème automatique)</p><div className="grid grid-cols-2 gap-x-3 gap-y-1">{RULES.map(r=>{const over=(d.ajust&&d.ajust.over&&d.ajust.over[r.id]);const off=!!(d.ajust&&d.ajust.off&&d.ajust.off.includes(r.id));const auto=r.pct(d,ajustCtx(d));return(<label key={r.id} className={'flex items-center gap-1 text-[11px] '+(off?'opacity-40':'')}><input type="checkbox" checked={!off} onChange={e=>setOff(r.id,!e.target.checked)}/><span className="flex-1 truncate">{r.label}</span><input className="inp !w-14 !py-1 text-right" type="number" step="0.5" value={over!=null?String(Math.round(Number(over)*1000)/10):''} placeholder={String(Math.round((auto||0)*1000)/10)} onChange={e=>setPct(r.id,e.target.value)}/></label>)})}</div></div>:null}
<label className="block mt-4"><span className="text-[10px] uppercase font-bold opacity-60">Positionnement de l’agent : {ajPct(A.manuel)}</span><input type="range" min="-10" max="10" step="0.5" value={Math.round(A.manuel*1000)/10} onChange={e=>patch(()=>({manuel:Number(e.target.value)/100}))} className="w-full"/></label>
<p className="text-[11px] opacity-70">Réservé à votre jugement de terrain, plafonné à ±10 points. <button onClick={reset} className="underline font-semibold">Réinitialiser les ajustements</button></p>
<div className="mt-3"><Btn on={()=>setEdit(!edit)}>{edit?'Terminer':'Modifier les coefficients'}</Btn></div>
</Card>)}

// Paramètres : la sauvegarde est automatique, on n'y vient que pour restaurer ou exporter.
function Parametres({list,back,restore,backup,snaps,persisted,restoreSnap}){const [msg,setMsg]=useState('');const [smsg,setSmsg]=useState('');const ref=useRef();
const used=useMemo(()=>Math.round(new Blob([JSON.stringify(list)]).size/1024),[list]);
const dt=(t)=>t?new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
return(<div className="max-w-3xl mx-auto px-4 pb-24" style={{paddingTop:'max(env(safe-area-inset-top),1rem)'}}>
<header className="flex items-center gap-3 mb-6"><button onClick={back} className="glass glass-btn rounded-full w-11 h-11 text-lg" aria-label="Retour">←</button><h1 className="text-xl font-extrabold">Paramètres</h1></header>
<Card title="Sauvegarde automatique">
<p className="text-sm opacity-85">Vos dossiers sont copiés automatiquement sur cet appareil après chaque modification. Aucune action de votre part, aucun fichier à télécharger.</p>
<div className="grid grid-cols-2 gap-2 mt-3 text-sm"><div className="glass rounded-xl p-2"><p className="text-[10px] uppercase opacity-60">Dernière copie</p><p className="font-semibold">{dt(snaps[0]&&snaps[0].at)}</p></div><div className="glass rounded-xl p-2"><p className="text-[10px] uppercase opacity-60">Copies conservées</p><p className="font-semibold">{snaps.length} / {SNAP_MAX}</p></div><div className="glass rounded-xl p-2"><p className="text-[10px] uppercase opacity-60">Dossiers</p><p className="font-semibold">{list.length}</p></div><div className="glass rounded-xl p-2"><p className="text-[10px] uppercase opacity-60">Espace utilisé</p><p className="font-semibold">~{used} Ko</p></div></div>
<p className="text-xs mt-3" data-testid="persist">{persisted?'🔒 Stockage protégé : le navigateur ne purgera pas ces données.':'⚠️ Stockage non protégé : Safari ou Chrome peuvent effacer ces données après une longue période sans ouverture. Installez Estimo sur l’écran d’accueil (Partager → Sur l’écran d’accueil) puis rouvrez-la.'}</p>
<p className="text-[11px] opacity-70 mt-2">Ces copies restent dans cet appareil : elles ne survivent pas à une perte, un vol ou un changement de téléphone. Pour cela, exportez un fichier ci-dessous et gardez-le ailleurs.</p>
{snaps.length>0?<div className="mt-4"><p className="text-[10px] uppercase font-bold opacity-60 mb-1">Revenir à une copie</p><div className="space-y-1">{snaps.map(s=>(<div key={s.id} className="flex items-center gap-2 text-xs"><span className="flex-1">{dt(s.at)} · {s.nb} dossier(s){s.stripped?' · sans photos':''}</span><button className="glass glass-btn rounded-lg px-2 py-1 font-semibold" onClick={async()=>{if(!confirm('Restaurer la copie du '+dt(s.at)+' ? Les dossiers sont fusionnés avec ceux de cet appareil ; en cas de doublon, la version la plus récente est conservée.'))return;setSmsg(await restoreSnap(s.id))}}>Restaurer</button></div>))}</div>{smsg?<p className="text-xs font-semibold text-emerald-600 mt-1">{smsg}</p>:null}</div>:null}
</Card>
<Card title="Fichier de sauvegarde">
<p className="text-sm opacity-85">Pour changer de téléphone ou archiver vos dossiers ailleurs.</p>
<div className="flex flex-wrap gap-2 mt-3">{list.length?<Btn on={()=>{backup(list);setMsg('Sauvegarde exportée ✓')}}>Exporter les {list.length} dossier(s)</Btn>:null}<Btn on={()=>ref.current.click()}>Restaurer depuis un fichier</Btn></div>
<input ref={ref} type="file" accept="application/json,.json" className="hidden" onChange={async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!confirm('Restaurer « '+f.name+' » ? Les dossiers du fichier sont fusionnés avec ceux de cet appareil ; en cas de doublon, la version la plus récente est conservée.'))return;setMsg(await restore(f))}}/>
{msg?<p className="text-sm font-semibold text-emerald-600 mt-2" data-testid="backupmsg">{msg}</p>:null}
<p className="text-[11px] opacity-70 mt-2">Une restauration ne supprime jamais un dossier plus récent ; si le stockage est plein, elle est refusée sans rien modifier.</p>
</Card>
<Card title="À propos"><p className="text-sm">Estimo V2.5 · PWA hors ligne, sans compte ni publicité.</p><p className="text-xs opacity-70 mt-1">Comparatif DVF Etalab · ventes jusqu’au {fmtDate(EstimoDVF.DATA_CUTOFF)}. Estimation indicative, non contractuelle.</p></Card>
</div>)}

function App(){const [list,setList]=useState(load);const [cur,setCur]=useState(null);const [page,setPage]=useState('accueil');const [snap,setSnap]=useState(null);const [snaps,setSnaps]=useState([]);const [persisted,setPersisted]=useState(null);const [dark,setDark]=useState(()=>localStorage.getItem(THEME)?localStorage.getItem(THEME)==='dark':matchMedia('(prefers-color-scheme: dark)').matches);
useEffect(()=>{document.documentElement.classList.toggle('dark',dark);localStorage.setItem(THEME,dark?'dark':'light');document.querySelector('meta[name=theme-color]').content=dark?'#061226':'#0b1f3a'},[dark]);
useEffect(()=>{const h=()=>{const hs=location.hash;if(hs.startsWith('#/d/')){setCur(decodeURIComponent(hs.replace(/^#\/d\//,'')));setPage('dossier')}else if(hs==='#/parametres'){setCur(null);setPage('parametres')}else{setCur(null);setPage('accueil')}};h();addEventListener('hashchange',h);return()=>removeEventListener('hashchange',h)},[]);
// Sauvegarde automatique : instantanés silencieux, rien n'est demandé à l'utilisateur.
const refreshSnaps=async()=>{try{const s=await listSnapshots();setSnaps(s);setSnap(s[0]||null)}catch(e){}};
useEffect(()=>{requestPersist().then(p=>setPersisted(p.persisted)).catch(()=>{});refreshSnaps()},[]);
useEffect(()=>{if(!list.length)return;const t=setTimeout(()=>{putSnapshot(list).then(()=>refreshSnaps()).catch(()=>{})},2500);return()=>clearTimeout(t)},[list]);
useEffect(()=>{const f=()=>{if(document.visibilityState==='hidden'){try{const l=load();if(l.length)putSnapshot(l)}catch(e){}}};document.addEventListener('visibilitychange',f);return()=>document.removeEventListener('visibilitychange',f)},[]);
const commit=(l)=>{if(save(l)){setList(l);return true}return false};
const restore=async(file)=>{try{const inc=await readBackup(file);const m=mergeDossiers(list,inc);
 if(!save(m.list))return 'Stockage plein : restauration impossible.';setList(m.list);refreshSnaps();
 return m.added+' dossier(s) ajouté(s), '+m.upd+' mis à jour, '+m.list.length+' au total ✓'}catch(e){return 'Restauration impossible : '+e.message}};
const restoreSnap=async(id)=>{try{const s=await getSnapshot(id);if(!s)return 'Copie introuvable.';const m=mergeDossiers(list,s.dossiers,{keepMedias:true});
 if(!save(m.list))return 'Stockage plein : restauration impossible.';setList(m.list);refreshSnaps();
 return m.added+' dossier(s) ajouté(s), '+m.upd+' mis à jour, '+m.list.length+' au total ✓'}catch(e){return 'Restauration impossible : '+e.message}};
const open=(id)=>{location.hash='#/d/'+id};const back=()=>{location.hash=''};
const create=()=>{const d=blank();commit([...list,d]);open(d.id)};
const d=list.find(x=>x.id===cur);const update=(fn)=>setList(l=>{const nl=l.map(x=>x.id===cur?{...fn(x),updated:Date.now()}:x);save(nl);return nl});
if(page==='parametres')return <Parametres list={list} back={back} restore={restore} backup={backup} snaps={snaps} persisted={persisted} restoreSnap={restoreSnap}/>;
return d?<Editor key={d.id} d={d} update={update} back={back}/>:<Home list={list} open={open} create={create} del={(id)=>commit(list.filter(x=>x.id!==id))} dark={dark} setDark={setDark} parametres={()=>{location.hash='#/parametres'}} snap={snap}/>}

// Filet de sécurité : une erreur de rendu ne doit pas laisser un écran blanc devant un client.
class ErrorBoundary extends React.Component{constructor(p){super(p);this.state={err:null}}
 static getDerivedStateFromError(err){return{err}}
 componentDidCatch(err,info){console.error('Estimo',err,info)}
 render(){if(!this.state.err)return this.props.children;
  const rescue=()=>{try{backup(load())}catch(e){}};
  return(<div className="max-w-2xl mx-auto px-5 py-10"><Logo size={52}/>
   <h1 className="text-xl font-extrabold mt-4 mb-2">L’application a rencontré une erreur</h1>
   <p className="text-sm opacity-80 mb-1">Vos dossiers sont toujours enregistrés sur cet appareil : ils n’ont pas été effacés.</p>
   <p className="text-xs opacity-60 mb-4">{String((this.state.err&&this.state.err.message)||this.state.err)}</p>
   <div className="flex flex-wrap gap-2"><button onClick={()=>location.reload()} className="rounded-xl px-4 py-2.5 font-semibold bg-navy-800 text-white glass-btn">Recharger</button>
   <button onClick={rescue} className="glass glass-btn rounded-xl px-4 py-2.5 font-semibold">Télécharger une sauvegarde de secours</button></div></div>)}}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);document.getElementById('boot').remove();
if('serviceWorker' in navigator)addEventListener('load',async()=>{try{
 const had=!!navigator.serviceWorker.controller;const reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
 const show=()=>{if(document.getElementById('upd'))return;const b=document.createElement('div');b.id='upd';b.setAttribute('data-testid','update');b.className='fixed top-3 inset-x-3 z-50 rounded-2xl bg-navy-800 text-white shadow-2xl p-3 flex items-center gap-3';b.innerHTML='<span class="flex-1 text-sm font-semibold">Mise à jour disponible</span><button class="rounded-xl bg-white text-navy-900 px-3 py-2 text-sm font-bold">Recharger</button>';b.querySelector('button').onclick=()=>location.reload();document.body.appendChild(b)};
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)show()});
 reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show()})});
 setInterval(()=>reg.update().catch(()=>{}),30*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
}catch(e){}});
window.ESTIMO_VERSION='2.5.0';
</script>
</body>
</html>
